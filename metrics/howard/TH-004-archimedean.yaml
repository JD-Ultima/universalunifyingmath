claim_id: TH-004
result: "'Multiplication makes more' (a(x)b >= a) is inconsistent with left distributivity on any carrier closed under + and division by positive integers (Q>0, R>0), with no regularity assumption; consistent on Z>=1 (witness 2ab). Regular (continuous, strictly increasing, associative) increasing operations are conjugate to addition (imported Aczel/Craigen-Pales)."
