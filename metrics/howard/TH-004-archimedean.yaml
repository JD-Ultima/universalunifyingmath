proof_status: "Proven (paper + z3 ground certificate). Not in Lean (core Lean lacks Q/R)."
novelty: "Low-moderate (elementary; we know of no prior statement in the Howard literature)."
reproducibility: "python3 computation/howard/axiom_lattice.py (core H1+LD+INC UNSAT; LD+INC, RD+INC paper cores)"
