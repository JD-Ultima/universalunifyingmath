claim_id: CT-016   # weight law; bounded search for an operator origin (gaps CT-G01, CT-G12)
question: "Does an operator built from the model's primitives alone, without the record list, reproduce the weights sqrt(k_r), k in {1,2,3,6}, as its matrix, its diagonal or its per-isotypic traces on the covariant record space R?"
result: "Operator form yes, operator origin no. Exactly on R, M_L = (1+(sqrt3-1) S Pi_X)(1+(sqrt2-1) S Pi_Y), where S = (1+(-1)^N E')/2, Pi_X = [N_Q N_q = 0] and Pi_Y = [N_q = 1] are built from partial traces and E'. But S Pi_X credits the qutrit amplitude sqrt3 to 9 of the 12 records with qubit letters only (6 E'-even qq, 3 commutator), which is the end-rule clause (CT-G02) written as a projector. No word in family F1 and no dressing in family F2 that is local in the original frame reproduces the weights; after transport through the read links a frame-local dressing does, with the frame assignment and the full-join credit as inputs (transport.md)."
formalization_status: "Formal (finite-dimensional linear algebra): Props 1, 2, 5, Lemma 3 and Theorem 4 in formalization/chain-theory/alpha/operator-origin.md; numerical checks in computation/chain-theory/alpha/operator_origin.out"
families:
  F1: "words of length <= 3 in 38 primitives, plus the identity: 56355 words, 11973 distinct compressions to R. Tests: (a) G_Omega/E' invariance; (b) class-scalar or class-constant diagonal vs sqrt(k) and vs k; (c) per-isotypic traces vs the Letter's point. Each test also after the G_Omega x <E'> twirl, for |C|, and for sqrt(C). Hits: 0 in every test."
  F2: "survival x attribution dressings, prod_x (1 + (sqrt d_Q - 1) S_x A_x^Q + (sqrt d_q - 1) S_x A_x^q): 7 survival operators x 81 attributions per exchange, 321489 ordered choices, 19926 distinct dressings. M_L is reached by 36 ordered choices, none local in the original frame. The 1992 original-frame local dressings contain no M_L. F2 contains all 9 survival/attribution rows of Supplement Table S5; among them only 'X where the letters sit' (139.030) is local."
theorems:
  - "Lemma 3 (Galois grading): all 38 primitives are Q(i)-rational (denominators 2^a 3^b, max 144). No rational construction (any length, any Q(i)-linear combination) has diagonal or per-isotypic traces proportional to the Letter's. It does not exclude the integer pattern k_r (K_L lies in the rational algebra, Prop. 2). With the amplitude tags <Phi_d|omega_d> = sqrt d, reproducing M_L is equivalent to producing the four class projectors with the Letter's tags."
  - "Theorem 4 (factorization): 30 of the 38 are products across qutrit|qubit slots: every covariant letter except Pi± = (1±E')/2, and the 8 non-covariant permutation and transpose letters. For products, and for their G_Omega or G_Omega x <E'> twirls, an E'-scalar mixed block has |mu_even| = |mu_odd|. M_L needs sqrt2:1 and K_L needs 2:1. Scope: for words containing Pi± or a read link the k_r, |C| and sqrt C negatives hold up to length 3 only (9 such words of length 3 have the mixed-block ratio +2 of K_L)."
  - "Prop. 5 (locality in the original frame): a dressing that credits each end's dimension only to records with a letter at that end, read where the letters sit, gives k in {1,2,4,...} on the 12 qubit-only records, so it cannot give the Letter's 3 and 6."
closest_misses:
  F1_diagonal: "no word fits sqrt(k) on the diagonal better than the identity (bare insertion), residual 0.2471; for k the best is L_PL1 . Pi+ . L_PL1 at 0.4572 vs 0.4674 for the identity"
  F1_traces: "L_PL2 . Pi+ . L_PL2 (read-link sandwich around the exchange symmetrizer): per-isotypic residual 0.1008 vs 0.2070 for the identity; non-covariant, with the wrong class ordering"
  F2_local: "97+48√2+36√3 (1/value 136.880, distance 0.057) and Table S5 'X where letters sit' (139.030, distance 0.062): they agree with M_L except on the 12 qubit-only records"
proof_status: "CT-G01 reduced to CT-G02 (end attribution) and CT-G08 (amplitude level); not closed. CT-G01's original closure criterion is met by Prop. 2 without closing the gap, and is sharpened to: an operator construction in which the end attribution is not an input."
reproducibility: "operator_origin.py imports records_independent.py and symmetry.py; fixed seed 20261030; about 16 min on 4 cores (926 s). Coordinator rerun 2026-10-30 (shared machine, 4350 s): output identical apart from the timing lines; Prop. 2 also cross-checked separately by xcheck_operator_form.py"
dependencies: [covariant records (F-CT-10), E' = E o T, end rule and copies clause (CT-G02), amplitude level (CT-G08)]
confidence: "High for the theorems (elementary, machine-checked) and for the negatives within the declared families. The families are ours. The G_Omega-breaking transport direction is tested in transport.md (CT-G01-transport.yaml)."
