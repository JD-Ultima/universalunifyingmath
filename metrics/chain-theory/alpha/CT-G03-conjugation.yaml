claim_id: CT-007   # acting central charge and Theorem 1 (CT-012); far-end conjugation and the direct-sum trace (gaps CT-G03, CT-G04)
question: "Does the axiom fix which block of the identification algebra carries conj(xi) (reading A vs A*), or is Theorem 1's selection invariant? Is there an axiom-level origin of the trace on C^d1 + C^d2 (CT-G04)?"
result: "The link's operator data are invariant under conjugating the labels at one end: the image of the identification group, the matching operators U (x) conj U, the stabilizer of the pair ket, the twirl and the reads. Only the trace functional moves (tr1 + tr2 -> tr1 - tr2). The selection depends on the relabelling eps only through e1 e2: +1 gives the object alone (A), -1 gives the object and 2R 2R 2U at a shared qubit (A*). Convention-free, the A link H1 (x) H2 is the off-diagonal block of Lambda^2 W and Sym^2 W, W = H1 + H2, with (2,3)_{1/6} in the 10. The A* link Hom(H2,H1) = H1 (x) conj H2 is the off-diagonal block of End W, with (2,3bar)_{5/6} in the 24. The centre Q acts on them as i(d2-d1) and i(d1+d2). Matching closure (MC: the matching algebra m_0 = {(zeta, conj zeta + 0)}, put in the stabilizer by the transpose identity, lies in the identification algebra) is relabelling-invariant. Among all invariant trace conditions alpha tr X1 + beta tr X2 = 0, MC holds iff alpha = beta, i.e. reading A. A* violates MC at every type, and B (trace on the link) violates it at unequal dimensions. The Lie algebra generated by su(H1) + su(H2) and m_0 is s(u(d1) + u(d2)) at every type, so the direct-sum trace follows from the matchings with no direct sum. Under MC, Theorem 1 is equivalent to P: at (2,2) the identification algebra is proper, so the global phase of an equal-dimension link is not an identification. Without P (reading C) the selection is the same two configurations as under A* (competitor 1/value 31.81)."
formalization_status: "Formal (finite-dimensional linear algebra and Lie theory): Props 1, 2, 6, Theorems 3, 4, 5, 8, Lemma 7, Cor. 9 in formalization/chain-theory/alpha/conjugation.md; exact sympy checks (2365 assertions) in computation/chain-theory/alpha/conjugation.out; Lean 4.35.0 core-only file proofs/lean/chain-theory/Conjugation.lean (20 theorems (19 with an axiom report; the helper `actScalar_Astar` is used by `actScalar_Astar_ne`), no sorry, axioms at most propext and Quot.sound) for the acting scalars, matching closure as integer arithmetic, the 76/42/23 enumeration and the selection for every acting predicate"
readings:
  A: "h_+ = {tr X1 + tr X2 = 0}, canonical link: acting iff d1 != d2; selects the object alone; MC at every type; |Y| = 1/6"
  A_star: "h_- = {tr X1 - tr X2 = 0} (the Letter's h_W with the far block acting by its conjugate): acting at every type; selects the object and 2R 2R 2U at a shared qubit; violates MC at every type; |Y| = 5/6; stabilizer centre i diag(1,1;1,1,-4) in labels, not U"
  B: "h_[d2:d1] = (d rho)^{-1}(su(L)): acting at no type and under no conjugation; selects none; equals A at d1 = d2; violates MC at (3,2)"
  C: "all of u(d1) + u(d2): acting at every type; selects the object and 2R 2R 2U at a shared qubit; MC trivially; violates P"
  relabellings: "eps = (1,1), (-1,-1): object alone; eps = (1,-1), (-1,1): object and 2R 2R 2U. E' = E o T (CT-G11) transposes both ends of a link, so it is eps = (-1,-1)"
  natural_spaces: "17 spaces built from H1, H2 by +, (x), conj, Lambda^k, Sym^2, End: (alpha_F, beta_F) proportional to (1,1) (W, Lambda^2 W, Sym^2 W, W (x) W, Lambda^3 W): object alone; proportional to (1,-1) (W', Lambda^2 W'): both; (0,0) (End W, End H1 + End H2, End L): both; proportional to (d2,d1) (L, Lambda^2 L, Sym^2 L): none; other (L', H1, H2, H1+H1+H2): both. Every rational ratio occurs; for a fixed ratio the object alone iff alpha = beta, the qubit configuration alone iff [alpha:beta] = [2:3]"
theorems:
  - "Prop. 1: Lambda^2 W = Lambda^2 H1 + H1(x)H2 + Lambda^2 H2 and Sym^2 W likewise, middle block = reading A link; End W = End H1 + Hom(H2,H1) + Hom(H1,H2) + End H2, Hom(H2,H1) = reading A* link; charges of Q per block 2d2, d2-d1, -2d1, d1+d2, -(d1+d2), 0; checked on a basis at (2,2),(2,3),(3,3),(2,4),(3,4)"
  - "Prop. 2: under the trace on L the centre acts on L as 0 for every type and every eps"
  - "Theorem 3: rho_eps(G), d rho_eps(g) = l and d rho_eps(su+su) = l_0 are eps-independent; every subgroup defined from (rho, omega) is carried by theta_eps; theta_eps*(tr1+tr2) = e1 tr1 + e2 tr2; Q acts on L as i(e1 d2 - e2 d1); the selection depends on eps only through e1 e2. conj is inner on SU(2) (sigma_y), inverts the central U(1) of U(2), is outer on SU(3) (tr diag(i,i,-1) = -1+2i); transposition at both ends is eps = (-1,-1)"
  - "Theorem 4: m_0 lies in the stabilizer (transpose identity); full stabilizer {(zeta, conj zeta + c)}, dim d1^2 + (d2-d1)^2; m_0 in h_[alpha:beta] iff alpha = beta; in eps-labels the matchings lie in h_W iff e1 = e2"
  - "Theorem 5: <su(H1)+su(H2), m_0> = s(u(d1)+u(d2)); with the full stabilizer: s(u+u) at d1 = d2, all of g at d1 < d2; group generated by SU x SU and the matchings (U, conj U + 1) is S(U(d1) x U(d2)); on L, the global phase lies in the generated algebra iff d1 != d2"
  - "Prop. 6: h_+ cap stab = m_0 at (2,3), centre U = i diag(1,1;-1,-1,0) (Thm S-stabilizer as stated); h_- cap stab has dim 4 but does not contain m_0, centre i diag(1,1;1,1,-4) in A* labels; both centres act on L as 1 (x) diag(0,0,1). At (2,2) Lemma S-conserved's clause 'it gives 4x = 0' holds for h_+ and fails for h_-"
  - "Lemma 7 / Theorem 8: invariant functionals are alpha tr1 + beta tr2; det sigma_F = det1^alpha_F det2^beta_F; trace calculus for +, (x), conj, Lambda^k, Sym^2, End; every ratio occurs; Theorem 1 selects the object alone iff alpha = beta != 0 at (2,2) and [alpha:beta] != [2:3] or no condition at (3,2)"
  - "Cor. 9: uniqueness implies MC at (2,2); MC at (2,2) and (3,2) plus a proper condition at (2,2) implies uniqueness; under MC, Theorem 1 is equivalent to P"
proof_status: "CT-G03 resolved conditionally on MC: the far-end conjugation is not an independent convention, and MC (relabelling-invariant) forces reading A and excludes A*. CT-G04 resolved conditionally on MC and P: the direct-sum trace is the unique invariant hyperplane containing the matchings and the algebra generated by the end-local special unitaries and the matchings. MC and P are not stated in the Letter and are not consequences of the axiom as a mathematical statement (the axiom does not define 'identification'); the Letter's Thm S-stabilizer presupposes MC. Open: an axiom-level reason for MC and P."
reproducibility: "conjugation.py: python3 -I conjugation.py --upstream /path/to/chain-theory (the clone at a28db89 is read as text, only for the source anchors of Sec. 0); exact sympy, no randomness; imports config_enumeration.py unmodified and checks its printout against config_enumeration.out; two runs identical apart from the runtime line; about 30 s on one core. Lean: LEAN=/path/to/lean-4.35.0/bin/lean ./run_conj.sh > Conjugation.out, about 4 s"
dependencies: [identification algebra (Letter Eq. 3, Supplement Sec. S3; CT-006), acting charge (Lemma S-center; CT-007), stabilizer (Thm S-stabilizer; CT-010), conserved count (Lemma S-conserved; CT-011), matchings and transpose identity (Letter Definitions; Lemma S-matching), configuration enumeration (config_enumeration.py; F-CT-3), covariant exchange (F-CT-10)]
confidence: "High for Props 1, 2, 6, Theorems 3-5, 8 and Cor. 9 (elementary; exact and, for the finite selection statements, machine-checked in Lean). The conclusion is conditional: it replaces a conjugation convention by two relabelling-invariant clauses (MC, P) that the Letter does not state. Their status as readings of the Letter's definitions is an interpretive judgement, not a theorem."
