claim_id: CT-020   # evidential weight of the 10-digit match; look-elsewhere analysis F-CT-4 with a rule space generated from the Lean definitions (gap CT-G10)
question: "F-CT-4 bounds the trial factor with a hand-declared rule space B (46080 rules, 15639 distinct values, density 103.9 per unit of 1/value in (120,155), 4.4e-6 expected chance values within 1 sigma of CODATA 2022). Is that conclusion robust when the rule space is generated mechanically from ChainAlpha.lean instead?"
result: "Yes. 15 declared mutation operators applied to the 44 definitions the readout depends on give 818 single mutants and 331490 pairs with disjoint sites (332308 mutants). 272988 are well-defined; they take 10340 distinct exact values, 1105 with 1/value in (120,155): density 31.6 per unit, expected chance values within +-1 sigma 1.3e-6 (B 4.4e-6; union of both spaces 5.6e-6). The only mutant value within relative 1e-4 of 1/alpha is the Letter's own (29292 mutants leave it unchanged); the next closest, (149 + 45 sqrt3)/31104 = 1/137.0569, is 9.9e5 sigma away (B: 1.3e5 sigma). An O(1) chance hit at the mechanical density needs ~2.5e11 mutants."
formalization_status: "Computed (exact arithmetic in Q(sqrt m)); declared space in formalization/chain-theory/alpha/mechanical-trial-factor.md; computation/chain-theory/alpha/mechanical_mutations.out; Lean check proofs/lean/chain-theory/mutation_spotcheck.out"
space:
  definitions: "readout cone of `readout objectWorld objectTwoPoint`: 44 of 52 Part 1 definitions (object, end rule, normalisation, letters and slots, record enumeration, exchanges, weight function, readout); Part 0 arithmetic held fixed; TwoPoint.valid, records, World.typeOf, World.wellFormed are in main but outside the readout"
  operators: "LIT (literal +-1), NEG (delete unary minus / not), LSW (swap two literals of one type in a definition), BLIT, REL (negate a test; < <-> <=), QNT (all <-> any), LOG (dual connective; drop an operand), IF (swap branches), MATCH (swap arm right-hand sides), AOR (+ - * / % each to the others; min <-> max), VAR (one occurrence of a declared label to its partner), ENDSWAP (all occurrences of a label pair in a definition), LIST/CAT/CONS (drop or duplicate an entry)"
  label_pairs: "dA/dB, d1/d2, dc/df, i/j, a/b, s1/s2, i1/i2, c1/c3, f/g, xs/ys, odd/even, read1/read2, readEnd/farEnd, .1/.2"
  size: "425 sites; 818 singles (47 fail to elaborate); 331490 pairs with disjoint sites (37105 contain a single that fails to elaborate); fixed and printed before evaluation"
outcome:
  singles: "742 well-defined, 163 distinct values, 244 equal to the Letter's; 24 readout dimension 0, 4 numerator 0, 1 beyond the resource bound (readout list > 4000 terms)"
  pairs: "272246 well-defined, 10340 distinct values; 17924 readout dimension 0, 3500 numerator 0, 715 beyond the resource bound (all contain the list-doubling mutant addRoot:CONS:2=dup0)"
  windows: "distinct values within relative 1e-2, 1e-3, 1e-4, 1e-6 of 1/alpha: 91, 9, 1, 1 (B: 288, 28, 4, 1); density flat across (120,155), (130,145), (136,138): 31.6, 32.9, 35.0 per unit"
validation:
  transcription: "chainalpha_transcription.py reproduces the unmutated readout and the 20 lines of upstream_mutations_lean.out (BASE + the author's 19 rewordings, incl. main/commutators verdicts) character for character"
  lean: "Lean 4.35.0 on every single mutant: 770 of 770 readouts identical, 47 of 47 predicted elaboration failures confirmed, the list-doubling mutant aborts (deep recursion); seeded sample of 300 pairs (seed 20261030): 266 of 266 readouts identical, 31 of 31 elaboration failures, 3 of 3 beyond the bound abort in Lean (deep recursion); 1118 of 1118 agree (mutation_spotcheck.out)"
comparison:
  overlap_with_B: "333 distinct values in both spaces (100 in (120,155)); 15306 of B's 15639 values are not mechanical values"
  author_rewordings: "values of 18 of the 19 reached by a single or a pair (5 of the 19 are themselves elements of the space); not reached: X_where_letters_sit (139.030)"
  table_S5: "12 of 15 closed-form alternatives reached (9 singles, 3 pairs); not reached: exchange of reads where the letters sit (139.030), count of read ends (70.190), normalised by the 172 records (0.758)"
not_contained: "multi-token rewordings and triples; most of B's per-class factor assignments and normalisations; the amplitude/Born reading and N = 172 (not definitions of the file); the selection conventions of F-CT-3 and Part 5 (outside the readout); Part 0 arithmetic; anything tried before the file was written (CT-G10)"
proof_status: "Look-elsewhere conclusion of F-CT-4 confirmed in a second, independently generated space. It remains a statement about trial factors, not about physics: neither space measures the variants actually explored (CT-G10)."
reproducibility: "mechanical_mutations.py reads the pinned ChainAlpha.lean (sha256 522844e9...c331da) as text and never runs the author's code; 2 worker processes, 17 min wall on 4 shared cores; Lean check 11 min (mutation_spotcheck.sh, 2 Lean processes)"
dependencies: [F-CT-4 (freedom.py, mutations_classified.py), upstream_mutations_lean.out, CT-G10]
confidence: "High for the counts and values (exact arithmetic, transcription checked against Lean on every single). The operator set and label pairs are ours; a different mechanical set gives a different density, but both declared spaces give expected chance hits of order 1e-6."
