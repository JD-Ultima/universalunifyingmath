claim_id: CT-020   # evidential weight of the 10-digit match; rule-family sensitivity analysis F-CT-4 E with a rule family generated from the Lean definitions (gap CT-G10)
question: "F-CT-4 B measures sensitivity over a hand-declared rule space B (46080 rules, 15639 distinct values, density 103.9 per unit of 1/value in (120,155); reference count 4.4e-6 within 1 sigma of a target uniform on (120,155), an illustrative model, not a calibrated p-value). How do these quantities change when the rule family is generated mechanically from ChainAlpha.lean by declared mutation operators?"
result: "At mutation depth <= 2, the same picture as B (corrected after review 2026-10-30, R4-CT-1; see reports/CORRECTIONS.md). 15 declared mutation operators applied to the 44 definitions the readout depends on give 818 single mutants and 331490 pairs with disjoint sites (332308 mutants). 272988 are well-defined; they take 10340 distinct exact values, 1105 with 1/value in (120,155): density 31.6 per unit (single mutants alone 1.09; a seeded sample of triples gives a low estimate of 58 at depth 3, so the density is still rising with depth and 'lower than B' holds at depth <= 2 only). Illustrative random-target model of F-CT-4 B (target U uniform on (120,155), rule outputs fixed): expected match count within +-1 sigma 1.3e-6 (B 4.4e-6; union of both families 5.6e-6), reference counts, not calibrated p-values. The only mutant value within relative 1e-4 of 1/alpha is the Letter's own (29292 mutants leave it unchanged); the next closest, (149 + 45 sqrt3)/31104 = 1/137.0569, is 9.9e5 sigma away (B: 1.3e5 sigma). The earlier threshold 'mutants for an O(1) chance hit' is removed (corrected after review 2026-10-30, R4-CT-6; see reports/CORRECTIONS.md)."
formalization_status: "Computed (exact arithmetic in Q(sqrt m)); declared space in formalization/chain-theory/alpha/mechanical-trial-factor.md; computation/chain-theory/alpha/mechanical_mutations.out; Lean check proofs/lean/chain-theory/mutation_spotcheck.out"
space:
  definitions: "readout cone of `readout objectWorld objectTwoPoint`: 44 of 52 Part 1 definitions (object, end rule, normalisation, letters and slots, record enumeration, exchanges, weight function, readout); Part 0 arithmetic held fixed; of the 8 outside the cone, TwoPoint.valid, records, World.typeOf, World.wellFormed are in main, and World.isPair, World.valence, World.shared, commutatorRecords are used by neither the readout nor main (corrected after review 2026-10-30, R4-CT-7(b); see reports/CORRECTIONS.md)"
  operators: "LIT (literal +-1), NEG (delete unary minus / not), LSW (swap two literals of one type in a definition), BLIT, REL (negate a test; < <-> <=), QNT (all <-> any), LOG (dual connective; drop an operand), IF (swap branches), MATCH (swap arm right-hand sides), AOR (+ - * / % each to the others; min <-> max), VAR (one occurrence of a declared label to its partner), ENDSWAP (all occurrences of a label pair in a definition), LIST/CAT/CONS (drop or duplicate an entry); MATCH yields no well-defined mutant (all 7 fail to elaborate), so 14 operators populate the evaluated space (corrected after review 2026-10-30, R4-CT-7(c); see reports/CORRECTIONS.md)"
  pair_rule: "unordered pairs with disjoint sites; the site of an IF, MATCH, LOG drop, LIST, CAT or CONS mutation is the whole node, so a mutation anywhere inside it is excluded, including the swapped IF's own condition (152 pairs) and the operand a LOG drop keeps (85 pairs); 2663 pairs excluded, 1367 of them sharing a site (xcheck_mechanical.out [8]; corrected after review 2026-10-30, R4-CT-7(a); see reports/CORRECTIONS.md)"
  label_pairs: "dA/dB, d1/d2, dc/df, i/j, a/b, s1/s2, i1/i2, c1/c3, f/g, xs/ys, odd/even, read1/read2, readEnd/farEnd, .1/.2"
  size: "425 sites; 818 singles (47 fail to elaborate); 331490 pairs with disjoint sites (37105 contain a single that fails to elaborate); printed in out section 1 before evaluation in the run; the version history does not record the order in which the operator set and the values were fixed (one commit, 9b32087; corrected after review 2026-10-30, R4-CT-5; see reports/CORRECTIONS.md)"
outcome:
  singles: "742 well-defined, 163 distinct values, 244 equal to the Letter's; 24 readout dimension 0, 4 numerator 0, 1 beyond the resource bound (readout list > 4000 terms)"
  pairs: "272246 well-defined, 10340 distinct values; 17924 readout dimension 0, 3500 numerator 0, 715 beyond the resource bound (all contain the list-doubling mutant addRoot:CONS:2=dup0)"
  windows: "distinct values within relative 1e-2, 1e-3, 1e-4, 1e-6 of 1/alpha: 91, 9, 1, 1 (B: 288, 28, 4, 1); density nearly flat across (120,155), (130,145), (136,138): 31.6, 32.9, 35.0 per unit (spacing at the scale of the bands, not at the 4.2e-8 window)"
  depth: "density of distinct values in (120,155): depth 1 1.09 per unit (38 values), depth <= 2 31.6 (1105), depth 3 about 58 (low estimate: Chao1 from a seeded sample of 12000 triples, scaled by the depth-2 calibration; xcheck_mechanical.out [6]); B is a complete product with no comparable truncation (corrected after review 2026-10-30, R4-CT-1; see reports/CORRECTIONS.md)"
validation:
  transcription: "chainalpha_transcription.py reproduces the unmutated readout and the 20 lines of upstream_mutations_lean.out (BASE + the author's 19 rewordings, incl. main/commutators verdicts) character for character"
  lean: "Lean 4.35.0 on every single mutant: 770 of 770 readouts identical, 47 of 47 predicted elaboration failures confirmed, the list-doubling mutant aborts (deep recursion); seeded sample of 300 pairs (seed 20261030): 266 of 266 readouts identical, 31 of 31 elaboration failures, 3 of 3 beyond the bound abort in Lean (deep recursion); 1118 of 1118 agree (mutation_spotcheck.out)"
comparison:
  overlap_with_B: "333 distinct values in both spaces (100 in (120,155)); 15306 of B's 15639 values are not mechanical values"
  author_rewordings: "2 of the 19 (fixesFar_always_true, wX_dA_equiv) leave the value unchanged; of the 17 that change it, the values of 16 are reached by a single or a pair ('reached': some mutant has the same value, sometimes by an unrelated mechanism); 5 of the 19 are themselves elements of the space; not reached: X_where_letters_sit (139.030) (corrected after review 2026-10-30, R4-CT-4; see reports/CORRECTIONS.md)"
  table_S5: "the values of 12 of 15 closed-form alternatives reached (9 singles, 3 pairs), some by an unrelated rule (Born weights as a count of 319 records at weight 1; smallest readable configuration by a qubit centre and a divided unread-link factor); not reached: exchange of reads where the letters sit (139.030), count of read ends (70.190), normalised by the 172 records (0.758)"
  born_value: "319/31104 reached by 7 mutants, all pairs, all containing recs:REL:0=neg (listed in out section 4): recs:REL:0=neg has 319 records (the 11 exchange-fixed products replaced by the 158 moved ones), and each partner alone sets every weight to 1, so the numerator is a record count equal to 79 + 2*48 + 3*42 + 6*3 by coincidence (corrected after review 2026-10-30, R4-CT-3; see reports/CORRECTIONS.md)"
not_contained: "multi-token rewordings and triples; most of B's per-class factor assignments and normalisations; the amplitude/Born reading and N = 172 (not definitions of the file; B contains the Born reading, and both families vary N, this one through readoutDim); the selection conventions of F-CT-3 and Part 5 (outside the readout); Part 0 arithmetic; anything tried before the file was written (CT-G10)"
proof_status: "At mutation depth <= 2 the sensitivity picture of F-CT-4 B recurs in a second declared family, generated mechanically with an operator set that is also ours; the comparison of densities is not established beyond depth 2 (corrected after review 2026-10-30, R4-CT-1; see reports/CORRECTIONS.md). Reference counts are quantities of an illustrative random-target model, not calibrated p-values or trial factors, and neither family measures the variants actually considered (CT-G10)."
reproducibility: "mechanical_mutations.py reads the pinned ChainAlpha.lean (sha256 522844e9...c331da) as text and never runs the author's code; 2 worker processes, 17 min wall on 4 shared cores (rerun 2026-10-30 after REVIEW4-CT, 12.7 min; only the relabelled statistics lines, the title, the section-1 header and the new Born-value list differ); Lean check 11 min (mutation_spotcheck.sh, 2 Lean processes)"
dependencies: [F-CT-4 (freedom.py, mutations_classified.py), upstream_mutations_lean.out, CT-G10]
confidence: "High for the counts and values (exact arithmetic, transcription checked against Lean on every single, 300 sampled pairs, and in REVIEW4-CT on 6 further pairs and 4 triples). The operator set, label pairs and depth are ours; a different set or depth gives a different density. In the illustrative model both declared families give reference counts of order 1e-6 at depth <= 2 (depth-3 low estimate about 2.4e-6); this is a property of the families and the model, not a probability for the construction (corrected after review 2026-10-30, R4-CT-1; see reports/CORRECTIONS.md)."
