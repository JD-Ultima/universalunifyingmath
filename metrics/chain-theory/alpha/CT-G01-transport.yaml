claim_id: CT-016   # weight law; transport of the qubit letters to the qutrit copies before crediting the join (gaps CT-G01, CT-G02)
question: "Carry the qubit letters to the qutrit copies through the read links (transpose identity on the 2-dim support), then credit the join's three directions. Does any such construction reproduce sqrt(k_r), k in {1,2,3,6}, on all 172 covariant records (3 and 6 on the 12 qubit-only records), as an operator, its diagonal or its per-isotypic traces, with the end attribution not an input?"
result: "An explicit record-wise construction reproduces M_L exactly, but it is not an operator origin. In it the class-by-class attribution follows from a frame and locality: the transported qubit-qubit records are QQ records of the same E'-parity. Two choices remain, and they carry CT-G02. (i) X must be assessed in the transported frame and Y in the original frame; a single frame fails (Theorem 6). (ii) The join credit must be the rank-3 sqrt3. But a transported letter is supported on the rank-2 common support S, and under the symmetry H = SU(2) x U(1) that the transport respects the credit is 2/sqrt3 or sqrt2. These give 1/value 140.702 and 139.030 (Theorem 5). As a linear operator, uniform transport fails for every D (fiber obstruction), and selective transport needs the qubit-only selector [N_Q = 0]."
formalization_status: "Formal (finite-dimensional linear algebra): Lemma 1, Props 2, 3, 7, 8, Theorems 4, 5, 6 in formalization/chain-theory/alpha/transport.md; exact (sympy) and numerical checks in computation/chain-theory/alpha/transport.out"
families:
  transports: "6 E'-covariant transports on B(H): identity value b in {0,1} at the third direction x orderings (R,L), (L,R), (S,S); b = 0 is literally 4 tau_q o R_{P_L} (resp. L_{P_L}) at each read link. All are H-equivariant, none is G_Omega-equivariant."
  F3: "frame-local survival x attribution dressings: per exchange 7 survival operators x 16 domains x 3 frames (orig-Q, orig-q, transported) = 336; ordered pairs 112896; x 3 join credits (J1 = sqrt3, J2 = 2/sqrt3, J3 = sqrt2) = 338688 ordered choices; 7504 distinct dressings, 4186 distinct values. M_L is reached by 6 ordered choices, all J1 with frames {transported, orig-q}. None under J2 or J3, also not in per-isotypic traces."
  F3a: "words of length <= 3 over 33 letters (24 covariant primitives of operator_origin.py + 9 transport letters: T_b(R,L), T_b(S,S), b in {0,1}, their adjoints, Ad of the support projector): 37060 words, 22635 with a transport letter, 5953 distinct compressions analysed with operator_origin.py's tests (operator, diagonal, per-isotypic traces; twirled, |C|, sqrt C). Hits: 0; no class-scalar or class-constant word at all."
theorems:
  - "Lemma 1: t(B) = iota B^T iota^dag is the unique traceless Hermitian operator at Q_i acting on the read link as B at q_i; t(sigma_x, sigma_y, sigma_z) = (lambda_1, -lambda_2, lambda_3); support exactly S (rank 2). The transported identity is PS + b|2><2| with b not fixed by the link."
  - "Prop. 2: the stabilizer of both read links in G_Omega is H = {U = c Vbar (+) c^-2} = SU(2) x U(1) (dim 4). Up to scale, t is the only H-equivariant map from qubit letters to qutrit letters; the only G_Omega-equivariant one is 0 (Schur). Every subgroup under which t is equivariant lies in H."
  - "Theorem 4 (fiber obstruction): T r = c T r' implies diag(T^+ D T)[r] = |c|^2 diag[r'] and equal Rayleigh quotients, for every D. Under T_b1(R,L): odd cross-mixed records collide with odd QQ records (kappa = 2/3, M_L and K_L need 1); even cross-mixed with even QQ (Letter sqrt2 vs sqrt3); commutator with odd same-link mixed (sqrt6 vs 1). The same holds for all six transports."
  - "Theorem 5 (two of three directions): for any subgroup under which the transport is equivariant, the smallest invariant projector containing a transported letter's support is PS (rank 2). The credit is Tr(PS C_omega3) = 2/sqrt3, or sqrt2 for the renormalized compressed pair (= the q1q2 pair of the joint state). sqrt3 needs the projector 1, which adds the line C|2> that the letter annihilates; 1 is the smallest invariant projector containing S only for groups that move S (e.g. SU(3)), and under those the transport is not equivariant."
  - "Theorem 6 (frames): a frame-local dressing equals M_L only if one exchange is assessed in the original frame with qubit priority (qubit end for the 48 E'-even mixed records) and the other in the transported frame with credit J1 (for the 6 E'-even qq records); the commutator records take 2 and 3 from them."
