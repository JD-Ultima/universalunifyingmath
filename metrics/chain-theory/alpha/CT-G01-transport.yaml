proof_status: "CT-G01 not closed. The direction left untested in operator-origin.md is now tested. Transport gives the end rule an operator-level reading (the frame in which every letter sits at the end where its read is taken), but the frame assignment (X transported, Y original) and the full-join credit sqrt3 remain inputs. CT-G01 reduces to CT-G02 (these two choices) and CT-G08."
reproducibility: "transport.py loads the definitions of operator_origin.py (which imports records_independent.py and symmetry.py) without modifying them or rerunning their searches; fixed seed 20261031 (operator_origin.py's own seed 20261030 for its definitions); 4 worker processes; 818 s measured on 4 cores shared with other jobs"
dependencies: [covariant records (F-CT-10), operator form and Props 2 and 5 of operator-origin.md (F-CT-11), read links |omega_2> on (Q_i, q_i) and the transpose identity (Letter Eq. (1)-(2)), end rule and copies clause (CT-G02), amplitude level (CT-G08)]
confidence: "High for Lemma 1, Prop. 2 and Theorems 4-6 (elementary; exact or machine-checked) and for the negatives within the declared families. The families are ours: half transports (one link at a time), reverse transport (qutrit letters to qubits) and the non-covariant F1 letters in F3a are not tested; the word negative holds up to length 3."
