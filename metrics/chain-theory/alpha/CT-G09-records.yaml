claim_id: CT-014   # the 172 records; commutator records as an exception (gap CT-G09); covariant exchange (CT-G11)
question: "Is there a uniform, operator-level definition of 'record', with no exception clause, that yields exactly the Letter's 172 records (classes 79 odd, 48 even mixed, 36+6 even same-end, 3 commutator)? Why is the difference sigma^(q1) - sigma^(q2) kept and not the sum? If no uniform definition exists in a declared family, what exactly does the exception clause add?"
result: "The record space of the Letter's construction with exchange f is R_f = P2 + (f-odd single-qubit operators): C_L = span{sigma^(q1) - sigma^(q2)} for the Letter's plain E, C = span{D_x, D_z, S_y} for E' (F-CT-10), C+ = span{S_x, D_y, S_z} for the covariant exchanges with eps_q = -1. All have the Letter's classes and value. The exception clause has two halves. (a) Single letters are admitted at the qubit and not at the qutrit. This is uniform: the reversal of the two insertions has a well-defined sign exactly on D = 1 + P2 + V_q1 + V_q2, because at a qubit the anticommutator of two letters is a scalar and at a qutrit every traceless single letter is also a symmetric composite (order-definiteness, OD). The Letter's own letters (Gell-Mann; also Lean's tracelessBasis 3) contain five anticommuting pairs whose commutators span lambda_1,2,3,8; the Letter's determinant argument excludes only invertible reads. (b) Only the exchange-odd combination is kept. No sign rule gives it: on D_0, R_f = {own sign +1} cup {survives f}, three of four (sigma, f) classes, not cut out by any single sign test; no sum of isotypic components has the Letter's classes. One identification rule does give it. (ID): a record is orthogonal to every identification whose action the exchange preserves (Comp_f; the global phase is one). D cap Comp_E^perp is the Letter's 172 exactly. For every covariant exchange Comp_f = 1 + Lie(G_Omega) (the matchings and the phase), so the rule gives the canonical, G_Omega-invariant P2 + C+, which equals R_f, with the Letter's sectors, value and isotypic table, iff eps_q = -1: the exchange acts on the read qubits by the unitary (sigma_y x sigma_y) SWAP, the matching that undoes the conjugation in the Letter's readers remark (alpha.tex:79). For E' (eps_q = +1) the Letter's commutator records are the matchings themselves, which (ID) removes; P2 + C+ sorted by E' gives 1/value 139.713 (M_L) or 138.348 (word rule). Difference vs sum: the suggested reason ('the sum is the action of the identification algebra, not a record, as the global phase is not') is exactly (ID); it selects the Letter's difference for E and for eps_q = -1, and the other three operators for E'. The transpose-identity collapse X -> X|Omega> identifies the antisymmetric qq products with the sums C+, and sends C to 0."
formalization_status: "Formal (finite-dimensional linear algebra, Schur's lemma): Props 1, 3, 5, 8, Theorems 2, 4, 6, 7, Corollary 11 in formalization/chain-theory/alpha/records-uniform.md; exact checks (rational linear algebra, sympy for the Gell-Mann and Weyl letters) in computation/chain-theory/alpha/records_uniform.out (1964 assertions with --upstream, 1914 without); numerical cross-check of the two record spans against records_independent.py and symmetry.py (imported unmodified)"
readings:
  OD: "order-definiteness: a record has a definite order sign, i.e. lies in D = A^perp, A = m(Sym^2 V) cap m(Lambda^2 V) = V_Q1 + V_Q2. Reads supplement.tex:81 ('the first part fixed whatever their order and the second by it') on spans; replaces the determinant argument for invertible reads. Admits none at d = 4, as Lean's weylIsSign 4 = false."
  ID: "an identification whose action the exchange preserves (f ad_X f = ad_X) is not a record. Generalizes the dropped 'multiple of the identity' (alpha.tex:109) to the exchange-compatible identifications. Not stated in the Letter."
  R: "covariant frames only: the exchange identifies the read qubits by sigma_y (eps_q = -1), the readers remark's matching (alpha.tex:79, supplement.tex:170 'A^T = -sigma_y A sigma_y'), which the Letter says it does not use."
frames:
  E: "plain swap (Letter, Lean exchAssign); automorphism; not G_Omega-covariant. Comp_E = E-even identifications (diagonal action xi^(L1) + xi^(L2) with the phase). D cap Comp_E^perp = R_E = the Letter's 172."
  E_prime: "E o T; anti-automorphism; covariant. Comp = 1 + Lie(G_Omega). R_E' = P2 + C (C = the qubit pair's matching algebra). D cap Comp^perp = P2 + C+ != R_E'. R_E' = D cap (I^E')^perp only with I^E' cap D = 1 + C+, not a Lie algebra; two-clause form R_E' = P2 + (D_0 cap stab_Omega)."
  eps_q_minus: "(-1)^Nq E' and sigma E'; covariant, neither automorphism nor anti-automorphism (anti at the copies, Ad of (sigma_y x sigma_y) SWAP at the qubits). R_f = P2 + C+ = D cap stab_Omega^perp."
theorems:
  - "Prop. 1: R_E = span of the Letter's records, R_E' = span of F-CT-10's; dim(C_L cap C) = 2, dim(C_L cap C+) = 1, C cap C+ = 0; Lie(G_Omega) = E'-odd single letters, C = its qubit part; plain frame: the x, z differences and the y sum are matchings; every R_f has classes (79,48,42,3) and numerator 79+48r2+42r3+3r6"
  - "Theorem 2 (order-definiteness): the traceless part of {A,B} vanishes for all letters iff d = 2; m(V(x)V) = P<=2 (192), m(Sym^2) = 1 + P2 + V_Q (186), m(Lambda^2) = 22 singles, A = V_Q; the flip descends to m/B iff B contains A; D = 1 + P2 + V_q (176), order sign = own sign there"
  - "Prop. 3: Gell-Mann and Lean's real basis: 5 anticommuting pairs (1,2),(1,3),(2,3),(4,5),(6,7), commutators span lambda_1,2,3,8; lambda_1..7 singular; Weyl X^a Z^b and a generic orthogonal Hermitian basis at d = 3: none; at d = 2 every orthogonal basis anticommutes pairwise. Literal rule with Gell-Mann letters: + 4 qutrit records, 1/value 132.977"
  - "Theorem 4 (sign rules): on D_0 the (sigma, f) classes are 90, 79, 3, 3; the seven rules with at most one sign test give 175, 169, 6, 93, 82, 93, 82; R_f = {sigma = +1} cup {sigma f = +1}, a 3-class union, not a coset; on P<=2,0 (90, 79, 11, 11) no union has dim 172"
  - "Prop. 5 (isotypic): P<=2 under SU(3) x SU(2) x <E'>: + (1,1) 3, (1,3) 3, (1,5) 5, (8,1) 16, (8,3) 48, (27,1) 27; - (1,3) 6, (8,1) 16, (8,3) 48, (10,1) 10, (10b,1) 10; exactly one sum of components has dim 172 (all but 10, 10b; wrong classes); R_E' meets (8,1)_- in 8 of 16; R_Fm under <Fm> has F-CT-10's table"
  - "Theorem 6 (identification rules): stab_Omega = 1 + Lie(G_Omega); Comp_E = I^E != stab; Comp_f = stab for the four covariant exchanges; D cap Comp_E^perp = R_E; D cap stab^perp = P2 + C+; R_f = D cap (I^f)^perp in every frame, with D cap I^f a Lie algebra iff f = E or eps_q = -1; without OD the rule gives 180"
  - "Theorem 7 (covariant exchanges): the letter-wise, pairing-preserving, involutive exchanges commuting with G_Omega are (eps_Q)^NQ (eps_q)^Nq E' (Schur: intertwiners are lines b -> b^T); E' alone is an (anti-)automorphism; all four give the Letter's sectors, value and isotypic table; R_f = P2 + C for eps_q = +1, P2 + C+ for eps_q = -1; for eps_q = -1 the qubit action is Ad of (sigma_y x sigma_y) SWAP"
  - "Prop. 8 (collapse): ker kappa cap P<=1 = Lie(G_Omega); kappa(C) = 0; kappa(C+) = kappa(E'-odd qq products) inside kappa(P2); plain: dim kappa(C_L) = 1, dim kappa(C_L+) = 2; P2 + (D_0 cap ker kappa) = D_0"
  - "Corollary 11: the clause adds V_q^{f=-1} (3-dim); operator form R_f = D_0 cap ker((1+f)[N=1]); halves (a) = OD, (b) = ID for E and eps_q = -1, 'the order-definite matchings are records' for E' (R_E' = P2 + (D_0 cap stab_Omega) = D_0 cap (P2 + Lie(G_Omega)))"
family:
  F: "8 composite spaces (P2, m(V(x)V), m(Sym^2 V), m(Lambda^2 V), D, D_+, D_-, one letter per read), with and without the identity where it occurs (12), x 24 conditions (none, traceless, f-even/odd, sigma = +-1, survivor, non-survivor, perp I, perp I^f, perp Comp_f, perp stab_Omega, perp Lie(G_Omega), perp / in G_Omega-invariants, perp read-link matchings, perp all pair matchings, ker kappa, <Omega|X|Omega> = 0, X Omega in C Omega, [X,P_Omega] = 0, X|L1 L2> = 0, [X,P_Li] = 0, [X,P_3] = [X,P_2] = 0) x 3 frames (E, E', Fm) = 864 members. 21 have dim 172. Every member with the Letter's classes is its frame's R_f: E via perp I^E or perp Comp_E on D, D_0; E' only via perp I^E'; Fm via perp I^Fm, perp Comp, perp stab, and D_0 cap Lie^perp. Occupation and slot-class projectors excluded by design."
  images: "single-letter part of Phi(P2) for L, R, Ad of P_3, P_2, P_Omega, P_L1, P_L2, P_L1 P_L2 (18 maps): never C, C_L or C+; the qubit pair projector gives 1 + C+, the join 1 + (8,1)_+"
