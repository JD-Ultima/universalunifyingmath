proof_status: "CT-G09 resolved conditionally. In the Letter's frame, (OD) + (ID) define the 172 records with no exception clause (R_E = D cap Comp_E^perp). Covariantly the same rule gives the canonical G_Omega-invariant space P2 + C+, which carries the Letter's sectors and value iff the read qubits are identified by sigma_y (R). Under E' (CT-G11 as written) the Letter's records need a second clause (the order-definite matchings are records), and the uniform rule gives 139.713 or 138.348. OD, ID and R are not stated in the Letter. Open: an axiom-level reason for ID and R, or, for E', for the matchings being records."
committed_statements: "audit.md:52 and :174 and algebraic.py:23 count binom(b,2) commutator records at even d_q; at d_q = 4 (105) these are not independent (span 15) and Lean's commutatorRecs gives none (weylIsSign 4 = false); F-CT-7's (2,4) entry 216.04 becomes 331.40 (none) or 307.91 (15); conclusion unaffected. gaps CT-G09 'only the difference is kept' is frame-dependent (true for E; under E' the kept span contains the y sum). CT-G11: four covariant letter-wise exchanges, not E' alone, all with the same value."
reproducibility: "records_uniform.py: python3 -I -X utf8 records_uniform.py --upstream /path/to/chain-theory > records_uniform.out (the clone at a28db89 is read as text, only for Sec. 0); runs from the repository root or its directory without --upstream (Sec. 0 skipped, 1914 checks); exact, no randomness; imports symmetry.py (and through it records_independent.py) unmodified; two runs identical apart from the runtime line; 35-150 s on one core"
dependencies: [records (Letter 'The records'; Cor. S-records; Thm S-further; CT-014), the known (Cor. S-known), survival and own sign (CT-015; CT-016), covariant exchange (F-CT-10; CT-G11), operator form of the weights (operator-origin.md Prop. 2; F-CT-11), transport and the common support (transport.md Lemma 1), conjugation at a qubit and a qutrit (conjugation.md Remark (a) and (b); readers remark supplement.tex:170), freedom left by symmetry (CT-G12)]
confidence: "High for the theorems (elementary, finite, exactly checked). The resolution is conditional: it replaces the exception clause by two readings (OD, ID) and, covariantly, by a choice of exchange at the read qubits (R). Whether these are the readings the Letter intends is an interpretive judgement, not a theorem. The negative statements are relative to the declared family F and to the 18 images."
