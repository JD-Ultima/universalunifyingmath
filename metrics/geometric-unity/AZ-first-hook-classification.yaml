result: >
  The first pure WA hook t=3kappa/136, u=0 admits no smooth full bosonic
  solution on a nonempty open observer domain over any smooth positive
  four-base, for reconstructed positive Z1 with any lambda<1/4.
  The flat observer's full ambient curvature-wedge map has rank 896 on H2
  for every mu=1/(1-4lambda)>0. Fixed-parameter radial rescaling and
  metric-only fibre density force the actual hook field to vanish;
  grade one then contradicts the negative Euler Ricci value.
