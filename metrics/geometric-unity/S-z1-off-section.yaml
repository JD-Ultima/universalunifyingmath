result: "S. Upsilon = 0 in the Zorro metric Z1 on open sets of Y that need not meet s(X), for every member with (x,y) != 0 (kappa != 0, slaved T_e in V, det M != 0): in (7,7) there is no solution on any nonempty open set, as in Z2; in (14,0) a solution forces lambda = 1/5, and for every member other than the twisted cone x(W_A + a W'_C Ad_Gamma), a != 0, the solutions on a connected open U are exactly the flat-base solutions with constant (t, u) and T_e = 0 (no analyticity assumed); for the twisted cone the same holds near the parallel set Pi, and away from Pi only rank Ric_g <= 1 is shown at lambda = 1/5. Conjecture F9 holds for Z1 at n = 4 on every open set and over every base signature: Z1 is Einstein on an open set W iff lambda = 1/5 and aleph is flat over pi(W)"
