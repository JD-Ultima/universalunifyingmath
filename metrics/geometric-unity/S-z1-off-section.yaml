confidence: >
  High for S1-S4, S5(a), (b), S10's (7,7) part for the Einstein classes, S11, S12: hand proofs on proven inputs with
  independent checks. High for S7, S9, S10: the continuation reduces them to round 10's refereed hand analysis at the
  radial points (rank 28 there is a hand fact, also checked). High for S8 and S14-S15 after internal review REVIEW12-GU-S: closedness and fibre analyticity are explicit
  for S8; the finite-cover argument handles ramification, poles of every order and the constant-kappa exception.
  This is internal review, not external peer review. Medium-high for S5(c), (d): the Schur reduction of S6 and the orbit classification of null curvatures are
  hand arguments, the evaluations exact. Not covered: the twisted cone at lambda = 1/5 away from Pi; T_e outside V or
  crossing det M = 0; T_o outside the invariant sector; n != 4.

rank_one_follow_up: >
  Exact example only, not a rank-one-Ricci classification. At x=0 use g0=I4, Ric0=diag(1,0,0,0), W0=0,
  P=(Ric0-I4/6)/2, R=P wedge I4, and the complete local metric g_ij(x)=delta_ij-R_iajb x^a x^b/3,
  lambda=1/5, cH=2, cV=3. This fixes the higher connection jets as well as Ric. Independent referee geometry
  gives relaxed ranks (41,42) at y=I4 and (42,43) at y=diag(2,3,4,5). By S4 the full-rank inconsistent point
  excludes every nonempty fibre-open consistent patch for this specified jet. Arbitrary Weyl tensors and remaining
  connection jets in the rank-Ricci<=1 class remain open. The full pointwise plane-wave Einstein locus is also not
  classified: Pi is Einstein and sampled off-Pi points fail; S5 proves that there is no Einstein open set.
