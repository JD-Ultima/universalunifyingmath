result: >-
  Exactly 952 closed real H6 fields are invariant under the simply
  transitive AN action, and their rotated span supplies global analytic
  closed lifts on a 6534-dimensional curvature-kernel submodule.
  The one-parameter full affine character ansatz has a kernel line
  with zero type (2,0) component at every character.
