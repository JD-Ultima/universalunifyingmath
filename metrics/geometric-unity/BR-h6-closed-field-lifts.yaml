formalization_status: >-
  Flat positive Z1 at lambda=1/5 with the BG symmetric-space
  identification and BC Gram. Positive constant scales transfer.
proof_status: >-
  A metric torsion-free connection in the simply transitive frame reduces
  invariant closure to an exact linear stack. Modular ranks and rational
  basis witnesses agree on sixteen blocks. Nonzero complex highest
  pairing minors give the orbit-span lower bound.
reproducibility: >-
  The default verifier checks seven complete closure witnesses,
  all orbit pairing minors and a full selected block. The --full-exact
  mode reconstructs every rank and exact nullspace. The optional
  --parabolic-characters mode checks the full parameter identity.
limitations: >-
  The results concern linear covariant closure. The orbit proof gives a
  lower bound on the span and leaves two types unresolved. Finite rotated
  sums need not have constant norm. Full nonlinear fields remain open.
dependencies: [BA1, BA2, BG1, BO1, BO2, BP2]
confidence: >-
  All block ranks and rational products were verified. Independent
  Chevalley-Eilenberg assembly agreed on every stack coefficient.
