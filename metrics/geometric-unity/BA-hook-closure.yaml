result: >
  The full WA derivative on iB*Gamma, B in Hq for q=2,6,10, is
  equivalent to covariant exterior closure. This supplies necessary
  closure and coefficient-curvature compatibility for the remaining
  pure H6Gamma and H4 branches; it does not solve their nonlinear equations.
