result: >
  A spectral rigidity criterion for positive Z1 at lambda=1/5 forces the observer
  metric to be Einstein and the four-base to be flat. Applied to the first single
  WA Lambda3 endpoint t/kappa=-1/400, u=0, it forces Te=0 and
  cV*kappa^2=150000/11 without assuming base flatness, traceG>=0 or analyticity.
