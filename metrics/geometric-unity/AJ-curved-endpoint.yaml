formalization_status: >
  AJ1 uses a smooth Riemannian four-base, reconstructed Z1, lambda=1/5,
  positive constant cH,cV and a real constant h. AJ2 additionally keeps the true
  dualized equation, compact (14,0), u(128), fixed parallel real WA, real fields,
  constant kappa!=0, invariant odd endpoint, det M!=0 and one single c/wGamma
  Lambda3 kernel away from every other non-vector factor on a connected open domain.
proof_status: >
  Proven from the stated reconstructed lemmas. The endpoint's grade-one stress
  gives 3300B^2-380tr(B)B+9tr(B)^2 I=0 for B=Ghat-hI.
  Rational fibre continuation and F4 along qg force h=15/(2cV).
  N1's Euler eigenvector then forces tr(B)=0 and B=0 in the positive metric.
  S5(b) supplies base flatness; its N10 curvature-pairing coefficient is
  computer-assisted. The original stress trace forces k=0. AI3 supplies the
  complete-equation converse and other-block regularity.
internal_consistency: >
  Eleven exact symbolic controls verify spectral, radial, Euler and scale
  coefficients. Nonzero spectral and indefinite nilpotent controls keep the
  geometric and positivity assumptions necessary to the stated proof explicit.
reproducibility: >
  Python 3.12, SymPy 1.14.0; python -X utf8 -I
  computation/geometric-unity/AJ_curved_endpoint.py. No Clifford or metric engine
  imported. The helper checks algebraic combinations of imported geometric
  lemmas; it does not independently reconstruct the observer metric.
