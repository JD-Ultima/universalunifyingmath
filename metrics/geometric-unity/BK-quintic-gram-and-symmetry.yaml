result: >
  The full grade-one equation on the pure real quintic H6 module is
  equivalent to an explicit scalar Gram identity and norm normalization.
  The general real Gram problem remains open. Its complete four-dimensional
  coordinate-permutation fixed space and one-dimensional standard-simplex
  fixed space have no nonzero solution. These exclusions extend to their
  SO5 conjugates and all positive constant observer scales.
