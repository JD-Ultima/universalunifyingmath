result: >
  At a smooth Riemannian four-metric point with nonzero rank-one Ricci tensor,
  suppose the electric Weyl tensor W(p,u,p,v) vanishes for u,v perpendicular to
  the Ricci eigenline p. The reconstructed Z1 relaxed system at lambda=1/5 and
  positive cH,cV is inconsistent on every fibre-open patch. Under the explicit
  S.0 slaved-vector assumptions the twisted cone has no Upsilon=0 solution on
  an open set meeting that fibre. The mixed Weyl part and all higher metric jets
  are arbitrary. Simultaneously nonzero electric/mixed Weyl and Ricci-flat
  nonflat points remain outside the theorem.
