formalization_status: >
  Formalized at the level of the algebraic curvature tensor R = R_g(x0) at the base point of Theorem J5 (Z2, radial
  ansatz t = f(s), u = h(s), slaved T_e in V, det M != 0, kappa != 0, (x, y) != 0, lambda != 1/4), in the two real
  forms of J1-J2: (14,0) and (7,7) (the latter from a base (1,3), (3,1) or (2,2)). The O'Neill sum of J5 is
  re-derived as (A_X, A_Y) = c_V/(4 c_H) Phi_y(X, Y) with Phi_y = sum g^ij tr(y^-1 (R(X,e_i).y) y^-1 (R(Y,e_j).y))
  (the lambda-term of G_lambda drops at every y), with the closed form 2 sum g^ij [tr(B_i C_j) - tr(M^-1 B_i M C_j)],
  M = g^-1 y; its order-eps^2 part at y = g + eps h is J5(d)'s quadratic form F(X, Y; h, h), and the restriction to
  g-traceless h is immaterial (R.g = 0). The leaf condition constrains only values of this quadratic form; the
  bilinear form F(X, Y; h, h') is not symmetric in h, h'. Two contractions built from quadratic values, C1 (both
  traces) and C2sym (the X-slot against an index of h, symmetrised polarisation), are evaluated in closed form for
  every algebraic curvature tensor.
internal_consistency: >
  The reduction is checked exactly at random rational data in bases (4,0), (1,3), (3,1), (2,2) (trace identity,
  closed form and scale invariance of Phi_y, Taylor coefficients eps^0, eps^1, eps^2 of det(y)^2 Phi_y). The three
  constant-curvature polynomials F(e0, e0; h, h) printed in J_slaved_sector.out section J5 are reproduced exactly in
  the same parametrisation. The contraction identities are exact polynomial identities for the generic algebraic
  curvature tensor in n = 3, 4, 5 (9 signatures), with C1 and C2sym computed from values of the quadratic form only;
  the unsymmetrised C2 and its swap C2' are printed as side identities, and C2 != C2' is checked as an expected result
  (the referee's R7-1, reproduced with the author's code). Constant curvature gives C1 = 144, C2sym = 108 != 0,
  consistent with J5(d)'s constant-curvature failures. The span of the 532 coefficients of F(X, X; h, h) (rank 47 of
  66, computed in (1,3), (2,2), (4,0); (3,1), (0,4) by g -> -g, F -> -F) independently contains Lambda^2. Three
  arguments agree: the trace identity, the Lorentzian/definite positivity, and the (2,2) block certificates.
  Independent referee cross-check: computation/geometric-unity/xcheck_round7.py (REVIEW5-GU), 67/67.
proof_status: >
  Proven. Lemma L0 (the reduction, from L-F5, F3, O'Neill with T = 0, J5(b)). Theorem L1: C1 = (n+2)|R|^2 and
  C2sym = (n+8)/8 |R|^2 + (n+4)/4 |Ric|^2 for every algebraic curvature tensor, every n >= 2 and every signature
  (hand proof: the Sym_g trace of ad_B ad_C is (n+2) tr(BC); the bilinear C2 = 3/4 |R|^2 + (n+3)/2 |Ric|^2 as the norm
  of an explicit 4-tensor; the antisymmetric part by the Jacobi identity; the first Bianchi identity), hence
  4 C2sym - C1 = 8 |Ric|^2 (n = 4) and 4 C2sym - C1 = 32 Lambda^2 for Ric = Lambda g; checked exactly (corrected after
  review 2026-10-30, R7-1: the first version used the unsymmetrised C2, with 8 C2 - C1 = 28 |Ric|^2 = 112 Lambda^2,
  which the leaf condition does not force to vanish; the identity is true, the inference was not). Corollary L2: no
  radial Z2 solution in (14,0) or (7,7), since J5(b) forces Lambda_g = -c_H/c_V != 0. Proposition L3:
  F(T, T; T^b (x) T^b) = 2 g(T,T) sum eta_i eta_j R(T,e_i,T,e_j)^2, definite for a Lorentzian or definite base, so
  there F = 0 forces R = 0 for every algebraic curvature tensor. Proposition L4 (Einstein, n = 4): F = 0 iff R = 0 in
  (4,0), (1,3), (3,1); iff R = c n (x) n with n a null (anti-)self-dual 2-form in (2,2) ("if" by hand, "only if" by
  exact linear-algebra certificates on the coefficients of the quadratic form); these Ricci-flat (2,2) tensors also
  satisfy the full condition.
novelty: >
  New within this audit: Theorem J5(c) holds in both signatures of the setting, (14,0) and (7,7). The open indefinite
  case of J5(d), (7,7) from a Lorentzian base (A4) or a (2,2) base (A5), has a negative answer: for the radial ansatz
  in Z2 (kappa != 0, T_e the slaved field in V, det M != 0), Upsilon = 0 has no solution on a neighbourhood of a point
  of s(X), for every member with (x, y) != 0 and every (z, w). Already the order-eps^2 leaf condition at a single point
  forces the base Einstein constant to vanish, against Lambda_g = -c_H/c_V. The leaf argument does not depend on the
  signature; the other Z2 signatures ((8,6), (10,4), ...) are not covered because J1-J2, hence J5(b), are not set up
  there. Not in the source.
reproducibility: "Exact (sympy rationals); fixed seed random.Random(20261030); 181 s on one core, a second run 170 s, identical apart from timing annotations; imports no repository code. Run from computation/geometric-unity: python3 J5d_leaf.py > J5d_leaf.out 2>&1 (57 checks, 57 True, each asserted). The first version (44 checks) ran in 102 s / 104 s."
empirical_testability: >
  None new. The result removes one candidate class of neighbourhood solutions (radial, Z2) in (7,7); the physically
  relevant reduction still depends on the undeclared rule for T off s(X).
dependencies: ["J5", "J1", "J2", "F3", "L-F1", "L-F5", "A4", "A5"]
confidence: >
  High: closed-form identities with hand proofs, verified exactly for generic tensors in several dimensions and
  signatures, plus two independent arguments (positivity for Lorentzian bases; span and block certificates on the
  quadratic form). The referee found one invalid step (R7-1, the unsymmetrised trace), now repaired and tested
  explicitly; the conclusion was unaffected. Scope: Z2, the radial ansatz, the two real forms (14,0) and (7,7). Not
  covered: other Z2 signatures; Upsilon = 0 on a neighbourhood beyond the radial Z2 ansatz (Z1; non-radial t, u); T_e
  outside V for large |T_o|; T_o outside the invariant sector.
