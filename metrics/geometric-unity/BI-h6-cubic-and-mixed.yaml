result: >
  At flat positive Z1 lambda=1/5, the whole real 30-dimensional
  harmonic-cubic H6 summand has no nonzero value with scalar symmetric
  grade-one quadratic. A specified A5-fixed mixed harmonic-3/5 family
  also has no nonzero scalar-quadratic value. Full pure H6Gamma fields
  cannot take either kind of value at even one point. Positive observer
  scales and variable amplitudes are allowed under the declared assumptions.
