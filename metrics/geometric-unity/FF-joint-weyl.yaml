result: >
  At a smooth Riemannian four-metric point with nonzero rank-one Ricci tensor,
  assume the electric and magnetic Weyl matrices relative to its Ricci eigenline
  commute and have a common nonzero kernel vector. The reconstructed Z1 relaxed
  system at lambda=1/5 and positive cH,cV is inconsistent on every fibre-open
  patch. Under the explicit S.0 slaved-vector assumptions the twisted cone has
  no Upsilon=0 solution on an open set meeting that fibre. Arbitrary higher
  metric jets are allowed. The common-kernel condition is essential to the scope.
