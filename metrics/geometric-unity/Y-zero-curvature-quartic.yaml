result: >
  For the base four-jet g=(1+beta(p.x)^4)I with |p|=1, beta!=0, a smooth
  zero-four-jet remainder, lambda=1/5 and positive cH,cV, the relaxed system is
  inconsistent at a positive fibre witness over the origin. Its coefficient
  rank is 28 throughout that fibre and it has an augmented rank-29 witness,
  excluding any nonempty fibre-open consistent patch. No local full-field
  Upsilon exclusion is inferred from this rank-deficient coefficient matrix.
