result: >
  Necessary symmetric-Gamma restrictions on either single real WA Lambda5 conic.
  At nonzero w=u/kappa the five-form is nonzero and its contraction Gram matrix
  has rank 13 or 14. Left branches require support dimension 14; right rank 13 is
  possible only when the slaved gradient is its annihilator direction. Support
  dimension at most 12 is excluded. An isotropic full-support form satisfies the
  selected channel at regular parameters. AH5 excludes that form's nonzero real
  scaling/SO14 orbit from full solutions on the first c/wGamma branch at nonzero
  w, using a remaining grade-nine coefficient. AH6 gives exact necessary norm
  bounds and Euler/Gram alignment on all four constant-odd endpoint domains.
  Those selected algebraic bounds are attained by real-form Grams, not by
  constructed observer metrics or full field solutions. AH7 excludes a constant
  normalized Gram spectrum on any nonempty fibre-open patch, including fixed
  scaling/rotation families. General varying Gram shapes remain open.
