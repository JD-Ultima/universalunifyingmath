formalization_status: >
  True dualized equation, real compact (14,0), u(128), fixed parallel real WA,
  constant kappa!=0, invariant odd field and det M!=0. Only one Lambda5 kernel
  is present, away from all other non-vector singular factors. The c/wGamma
  phase is i (grades 4/8); w/cGamma phase is 1 (grades 6/10). Real smooth weights
  are not both zero in the chosen kernel chart and are both nonzero at w!=0.
  AH6-AH9 additionally assume positive Z1 with constant cH,cV>0, lambda<1/4 and
  c=4cV(1-4lambda)>0, on an entire constant-odd zero-u endpoint domain. Its
  nonzero chart weight is absorbed into an arbitrary real five-form; no
  simplicity is assumed. Isolated zero-u points on varying conics are not covered.
  AH9's full endpoint exclusion concerns ONLY the first c/wGamma pair's two
  constant endpoints. No higher-grade derivative term is dropped there:
  Dk has grades3/7 or7/11. Opposite-pair derivatives can have grades5/9.
proof_status: >
  AH1 derives Sym(Q13*Gamma/i)=(160/3)rs*N*I-(304/3)rs*S for arbitrary real
  five-forms by the two-pattern metric-contraction count and symbolic calibration.
  Derivative/mixed terms have no symmetric output by V tensor Lambda5 types;
  AF supplies the unchanged vector/invariant terms. AH2 uses positive Gram
  linear algebra and the two negative f(-1/208) values to obtain N>0 and
  rank S=13 or 14. AH3 gives branch signs and strict/equality gradient bounds.
  AH4 is an explicit algebraic channel limitation, not a full solution.
  Independently accepted in reports/reviews/REVIEW31-GU-AH-2026-11-02.md; all 25 checks reproduced.
  AH5 uses that isotropic Gram to force C=0 at nonzero w on its declared orbit.
  Kernel derivatives have grades 3/7/11 and vector derivatives no grades 5/9.
  Direct cyclic-form polarization gives Q9/i coefficient -(16/3)(4r^2+17s^2),
  nonzero for every real nonzero chart, so no derivative choice can complete it.
  Independently accepted in reports/reviews/REVIEW34-GU-AH-CYCLIC-2026-11-02.md;
  all 14 cyclic-obstruction checks reproduced.
  AH6 derives complete Q1/i=q1*N*I+ell*S for each pure endpoint copy by the
  twelve-slot contraction count and exact calibration. Kernel derivatives have
  no grade one, and v=Dv=0 on a constant-odd domain. N1(d), trace reversal and
  0<=mu=S(e,e)<=N give Se=mu*e and the exact lower norm bounds. Every bound
  is algebraically attained with e a Gram eigenvector. Nonzero isotropic Grams
  are excluded there. AH7 homogenizes the constant normalized stress
  characteristic polynomial as product(D*H-alpha_j*tau*I)=0. S4 extends only
  that metric identity over the positive fibre. At tau=0, self-adjointness
  would force H=0 and violate N1; connectedness therefore preserves the actual
  negative trace sign. F4's exact radial trace tends to
  14b+30/c+135/(2cV)>0, giving a contradiction. AH6-AH7 are accepted in
  independent internal Review39, which reproduced the 74-control helper.
  AH8 uses the positive Gram trace budget, or its complement NI-S, to bound
  the NONPOSITIVE Ricci index. Strictness follows from b>0 even at zero
  eigenvalues. F4/S3 supply ten negative vertical directions and HV=0 at Pi:
  row1 cannot meet Pi, rows2/3 require a positive-definite horizontal block,
  and row4 allows at most one nonpositive horizontal direction. AH8 is accepted
  in independent internal Review40. AH9 establishes universal Q5/Q9 sandwich
  formulas on both first-pair endpoints by the complete symbolic quadratic
  basis-pair orbit cover. Gamma contractions give nonzero multiples of
  (Omega^2)4 and (Omega^2)8. Higher-grade vanishing forces Omega^2=N and vector
  sandwich. An orthogonal-involution eigenbasis argument then forces every
  nonzero real grade-five Omega to be a simple blade. AH7 gives the endpoint
  contradiction. Independently accepted in internal Review41. No full-system
  existence result or general opposite-pair endpoint exclusion is claimed.
internal_consistency: >
  Exact controls include both real phases, general nondecomposable forms with
  off-diagonal Gram entries, full fourteen-dimensional support, mixed/derivative
  terms and both kernel charts. Cyclic supports give N=14, S=5I exactly. The
  regular first-conic channel point has nonzero vector factors and no other
  non-vector kernel; its scalar channel balance is exact. AH5's direct phased
  output confirms that same balance and the nonzero remaining coefficients.
  The three displayed coefficient polynomials generate (r^2,rs,s^2) exactly.
  AH6 checks all four compact copies on zero, simple, nondecomposable,
  off-diagonal and full-support forms, both kappa signs symbolically, all
  fourteen derivative directions, first-pair AA4 identities and surviving
  opposite-pair Cartan jets. Sharp and nondecomposable Gram controls satisfy
  the full selected Euler vector equation, without asserting metric realizability.
  AH7 checks actual nondecomposable normalized Grams, scale invariance,
  different spectra, all four homogeneous characteristic polynomials with
  repeated roots, the leading H^14 zero-trace term and the exact radial scalar
  formula. No eigenframe, field or inequality is analytically continued.
  AH8 checks complementary Ricci rewrites, all strict rational caps and
  first-forbidden-index gaps, vertical signs for every lambda<1/4, additive
  negative/nonpositive block conventions and the rank-two Ricci-kernel control.
  Pi retains the local-parallel/holonomy definition; no inequality continues
  to other fibre points and no attainable-index sharpness is asserted.
  AH9 checks all14 external slots with symbolic independent real A,B for
  intersections0..5 on both copies, including the diagonal case. Signed
  permutations with an unused-axis determinant repair give the SO14 orbit
  cover, and polarization proves the all-form identities. General full-support
  controls, scalar/sandwich grade bounds and retained derivatives check the
  conventions. A full-support counterexample has scalar square and vanishing
  wedge contractions but nonzero Q5, so weaker conditions do not replace the
  vector-sandwich step. The simplicity proof is not replaced by finite tests.
reproducibility: >
  Python 3.12, SymPy 1.14.0. Run python -X utf8 -I
  computation/geometric-unity/AH_lambda5_gram.py and python -X utf8 -I
  computation/geometric-unity/AH_cyclic_obstruction.py. Fresh exact symbolic/rational
  controls use T's accepted Clifford implementation, not the J/R evaluator.
  No off-repository dependency, randomness or numerical parameter fitting.
  The original helper checks the cyclic form's Gram; AH5 adds integer Clifford
  polarization and a direct phased control on the full form. The recorded runs
  preserve the original 25 Gram controls and AH6-AH7's 49 controls, adding
  20 AH8 controls and 50 AH9 controls. The recorded run passes 144 exact checks
  in 11.5 seconds.
  The separate AH5 run passes 14 checks in 5.5 seconds.
novelty: >
  Bounded necessary stress-spectrum reduction within this investigation for
  the Lambda5 branches, with a full-equation obstruction for one explicit orbit
  on the first pair, necessary constant-endpoint Euler/Gram bounds and a
  fibre-open fixed-spectrum exclusion, plus Ricci-index and parallel-set
  restrictions and the first-pair constant-endpoint exclusion. The common
  higher-quadratic zero locus is classified for those two copies; no arbitrary
  five-form orbit classification, full singular classification or literature
  novelty is claimed.
empirical_testability: None new; necessary field-equation constraints.
dependencies: [R2, R4, R6, J1, AF1, AA4, N1, F4, S2, S3, S4]
confidence: >
  AH1-AH4 and AH5 independently reviewed internally in their separate reports. The
  full-support channel control remains valid, while a remaining equation excludes
  that orbit on the first branch at nonzero w. AH itself asserts no all-form
  moving-branch exclusion or field solution; AP supplies the later first-conic
  exclusion. AH6-AH7 are accepted in independent internal Review39; their
  exact controls pass, and algebraic channel feasibility is explicitly
  distinguished from field or metric existence. AH7 concerns constant
  normalized spectra on a relative-open fibre patch; it does not require
  nonzero spectral derivatives at every point. AH6's isotropic pointwise
  exclusion inside constant endpoint domains is separate.
  AH8's bounded inertia proof is accepted in independent internal Review40
  and has passing exact controls. It does not classify fields away from Pi
  or replace the full nonlinear equations.
  AH9's explicit algebraic proof and derivative separation exclude both
  first-pair constant endpoint domains through AH7; the independent internal
  assessment is Review41. All Q controls share T's accepted Clifford engine;
  the separate elementary simplicity proof supplies the universal implication.
