result: >
  No full bosonic solution exists on a nonempty positive-Z1 observer domain
  in the first single Lambda5 c/wGamma conic. Full higher-grade equations
  force a zero or simple five-form for every nonzero real kernel chart.
  At nonzero w this contradicts AH2's positive Gram-rank bound; AH9 excludes
  the remaining constant zero-w endpoint domains.
