formalization_status: >
  AU1 applies to smooth positive n-bases, positive cH,cV and lambda<1/n.
  AU2-AU3 retain all AR assumptions: positive four-base/Z1, compact (14,0),
  u(128), true bosonic equation, fixed parallel real WA, real smooth fields,
  constant nonzero kappa, regular vector block and entire connected opposite
  single-Lambda5-conic domain away from coincident non-vector factors. AR
  supplies lambda=1/5 and the smooth fixed Ricci-gradient identity.
proof_status: >
  Along a vertical geodesic in normal base coordinates, Koszul gives a
  symmetric-plus-skew horizontal connection operator. The Riccati trace,
  constant logarithmic fibre speed and intrinsic fibre Ricci prove AU1.
  No Riemannian-submersion assumption is used on Z1. The correction is a Gram
  form into so(H), hence positive and rank at most six at n=4, with Euler in
  its kernel. An open Euler-collinear solution would make this correction a
  scalar metric on nine tracefree vertical directions. Rank forces it zero;
  the actual fibre-open curvature action then forces a flat base and a
  constant odd patch, excluded by AR1. Continuity of 13-minors proves the
  repeated Ricci eigenvalue everywhere. At a critical point the full shifted
  Ricci endomorphism is positive semidefinite; its vertical kernel supplies
  at least four nonzero Hessian directions. The actual Euler curve and AR5b
  give denominator-free critical-rank equations, factoring to eleven cubics.
internal_consistency: >
  A local fibre-geodesic vector field is extended independently of base
  coordinates. Its bracket with horizontal lifts vanishes along the whole
  selected fibre, which justifies its vertical derivative. Positivity is
  used in the correction Gram form and the full shifted-Ricci kernel step.
  The 33 bound counts distinct scalar values, not critical points. AT excludes
  D=0; no root of delta or any vector factor is divided away. Left-arc scalar
  candidates remain, so the cubic equations do not exclude the full branch.
reproducibility: >
  Python 3.12, SymPy 1.14.0. Run python -X utf8 -I
  computation/geometric-unity/AU_opposite_ricci_spectrum.py. The new helper
  uses the accepted F_jets library, without running any old check main.
  All 24 controls pass in 2.161 seconds: four declared positive curved-base
  off-section jets in n=2,3,4 (245 vertical tensor entries), correction ranks
  and Euler kernel, and exact critical-curve polynomial coefficients.
  Independent Review51 reproduces all 24 controls in 2.148 seconds.
  Universal geometry, density and critical-point arguments are hand proofs.
novelty: >
  Bounded vertical-Ricci and opposite-conic spectral reductions in this
  reconstruction, with a finite necessary critical-value bound. No
  literature-first claim, full classification or physical evidence.
