result: >
  Positive Z1 has an exact vertical Ricci formula with a positive semidefinite
  curvature-action correction. In the full AR opposite-conic sector, no open
  patch has scalar gradient parallel to Euler. The Euler Ricci eigenvalue has
  multiplicity at least two everywhere. Critical Hessian ranks are at least
  four, and at fixed positive scale there are at most 33 critical scalar values
  among eleven explicit cubics. These are necessary conditions, not existence.
