result: >
  On actual regular solution patches of the single opposite Lambda5 conic,
  the ordinary and right-Gamma symmetric cubic Clifford trace tensors
  vanish when all three indices are perpendicular to C. The first Gram
  transport condition reduces to a positive multiple of one symmetric
  cubic tensor plus a cyclic-zero tensor. Full zero-order compatibility
  kills the latter away from finitely many parameter levels, retained by
  continuity. Zero-order redundancy of the remaining cubic is unresolved.
