result: >
  On the full simply connected flat positive Z1 model at lambda=1/5,
  every finite real signed Borel measure on SO5/SO4 defines a real
  analytic closed H6 orbit average of BC's seed. No such field, including
  any finite real linear combination of SL5-translates, can satisfy the
  full pure H6Gamma equation on any nonempty open subset. A particular
  compact-average construction is a 121-dimensional equivariant right
  inverse to evaluation. Positive-scale transfers are included.
