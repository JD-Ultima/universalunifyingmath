result: >
  For smooth Riemannian four-metrics with a simultaneous orthonormal frame in which
  Ric=rho e0 tensor e0, rho!=0, and W=omega H, the reconstructed Z1 relaxed system
  at lambda=1/5 and positive cH,cV is inconsistent on every fibre-open patch over
  the point. H has H0123=1, H0231=-1, H0312=0, with curvature symmetries and no other
  independent components. Arbitrary higher metric jets are allowed. Under the
  explicit S.0 slaved-vector assumptions the twisted cone has no Upsilon=0 solution
  on an open set meeting that fibre. This is one mixed-Weyl frame orbit.
