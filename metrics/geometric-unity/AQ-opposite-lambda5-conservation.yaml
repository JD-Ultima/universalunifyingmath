result: >
  On the single opposite moving Lambda5 conic, the complete grade-one and
  symmetric Gamma equations give an exact metric reduction in the odd scalar
  a. Contracted Bianchi forces |da|^2 and Delta a to be locally functions of a
  on every regular patch. The gradient is a Ricci eigenvector with eigenvalue
  locally depending only on a. These necessary conditions do not classify or
  construct full solutions.
