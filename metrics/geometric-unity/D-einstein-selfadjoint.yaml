result: "D3. Weyl annihilation is automatic for every admissible Shiab; self-adjointness forces the exact Einstein ratio; self-adjoint Einstein Shiab operators exist (W_A = [*Phi^3 ^ .]_A, W'_A), so GU-P09 as stated is false"
