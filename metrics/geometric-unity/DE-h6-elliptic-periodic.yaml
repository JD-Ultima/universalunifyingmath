result: >-
  Exterior closure is real elliptic on the pure H6 type (5,5).
  Closed fields are covariantly harmonic. Each value has a
  bounded global analytic lift invariant under a sufficiently
  long cyclic geodesic translation. Full group Plancherel
  excludes nonzero square-integrable pure-type closed fields.
limitations: >-
  Pure-type linear closure. The nonlinear equations and periodic
  lifts by general mixed fields remain open.
