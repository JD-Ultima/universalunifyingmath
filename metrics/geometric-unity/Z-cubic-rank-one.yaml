result: >
  With U's nonzero rank-one-Ricci/zero-Weyl quadratic normal-coordinate jet,
  arbitrary 200 cubic and 350 quartic metric coefficients and arbitrary smooth
  remainder with zero four-jet, the relaxed system has coefficient rank 42 and
  augmented rank 43 at a fibre witness. It is consistent on no fibre-open patch.
  In S.0's slaved vector sector this excludes twisted-cone Upsilon=0 solutions
  on open sets meeting the fibre. Normal-coordinate invariance extends the result
  to every smooth Riemannian four-metric with nonzero rank-one Ricci and zero
  Weyl tensor at the base point. Nonzero Weyl and Ricci-flat nonflat points remain open.
