result: >
  Global realization of Q15's complete constant invariant bosonic family on
  AM's complete positive flat observer and translation-torus quotients.
  With n=X^2+Y^2>0, the real roots exist exactly when C=cV*kappa^2/n>=9360.
  An explicit hand factorization gives the unique vector-singular scale
  Cstar(A), where A=((XW-YZ)/n)^2, and the exact regular-sector root counts.
  Scalar and axial Clifford fields and the fixed operator descend for every
  torus spin choice. Singular roots still solve the constant-ansatz equation
  but lie outside the sector imposing det M!=0.
