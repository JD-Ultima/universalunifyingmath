result: >
  No smooth full bosonic solution exists on a nonempty positive-Z1 observer
  domain in the opposite single WA Lambda5 w/cGamma conic under the original
  compact-real, true-equation, regular-vector and noncoincident-kernel assumptions.
  A direct ambient Clifford normal-moment identity and the actual Gram force a
  rational norm profile incompatible with AR5b at constant positive kappa^2*c0.
  Combined with AP3, both single WA Lambda5 conic domains are empty. Smooth
  persistence and R2/R4 also exclude a nonzero extra even Lambda5 component
  of a smooth full solution at any point away from coincident factors,
  without requiring the odd field
  globally to remain on a conic. Zero-component contacts are not excluded.
