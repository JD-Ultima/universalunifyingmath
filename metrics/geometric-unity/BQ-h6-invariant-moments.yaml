result: >-
  Exact invariant grade-five and grade-nine forms on every H6 curvature
  isotypic type exclude all 15 single types and at least 94 two-type
  supports. They give a sharp 753/1285 upper bound on the energy fraction
  in the old 135-dimensional module under these two scalar equations.
