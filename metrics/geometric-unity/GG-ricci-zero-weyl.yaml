result: >
  At a positive Riemannian four-metric point with Ric=0, W!=0 and both chiral Weyl
  determinants zero, reconstructed Z1 at lambda=1/5 and positive cH,cV has no
  fibre-open relaxed-system solution. Under the explicit S.0 slaved-vector
  hypotheses the twisted cone has no Upsilon=0 solution on an open set meeting
  that fibre. All higher metric jets are allowed at those nonzero-curvature points.
  Zero-curvature points remain outside this theorem; the complete flat quadratic control has
  coefficient/augmented ranks 28/28.
