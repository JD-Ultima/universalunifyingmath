result: >
  The flat positive Z1 observer over standard affine R4, at lambda=1/5 and
  arbitrary positive cH,cV, is globally isometric to the determinant-one SPD5
  symmetric space with cV times its trace metric and is geodesically complete.
  Translation torus quotients remain complete; the Levi-Civita spin connection
  and Clifford-soldering form descend for all sixteen torus spin structures.
  AI3's known constant odd, zero even bosonic field descends at
  cV*kappa^2=150000/11, with full slaving determinant -99*kappa^4/625.
