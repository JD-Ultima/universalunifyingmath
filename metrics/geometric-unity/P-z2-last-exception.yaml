result: "P. The last Z2 exception of round 9 is empty: M9's exceptional set Z of base curvatures (where the first integrability condition of the fibre equation Hess_F w = mu(w) (Ric_F + A) could hold on an open set) is exactly {R : (curvature operator)^2 = 0} = {R : A_x vanishes identically on the fibre}, i.e. {0} over a (4,0) base and the null (pp-wave type) curvatures over (1,3), (3,1), (2,2) bases; with M9's flat-case argument the fibre equation has no local solution with mu != 0 for any base curvature and any mu, so under (H) Upsilon = 0 in Z2 has no solution on any nonempty open set for every member with (x, y) != 0, including x (W_A + c W'_C Ad_Gamma), c != 0, with xz +- yw = 0, away from s(X) (kappa != 0, slaved T_e in V, det M != 0)"
