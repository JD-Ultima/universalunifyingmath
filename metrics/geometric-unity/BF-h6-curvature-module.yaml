formalization_status: >
  A real tensor/metric statement on the flat positive four-base,
  reconstructed Z1 at lambda1/5, cH,cV>0. The domain is the full
  real36608-dimensional H6 hook, all slots covariant; the curvature
  acts on its coefficient covector in d_nabla squared. SO5 is the
  symmetric-model isotropy and SO4 fixes its fifth unit coordinate vector.
  No gauge operator or kappa is needed for the geometric bound. Its
  use as a necessary GU condition retains BA's separate assumptions.
proof_status: >
  BF1 verifies the explicit nonzero hook is SO4-fixed and covariantly
  closed. Therefore it lies in the SO5-equivariant curvature kernel.
  All140 tangent columns calibrate the full standard SO5 action;
  its Casimir is -4sum of horizontal Nomizu tensor actions squared
  on stabilizer-fixed tensors. Positive Gram ranks2/2 and an exact
  full-component relation give minimal polynomial(c-18)(c-40).
  Both real eigenprojections are nonzero and orthogonal. BF2 embeds
  each cyclic orbit module into functions on SO5/SO4 by matrix
  coefficients. A sphere harmonic decomposition and a direct
  fixed-line/projection proof of irreducibility identify dimensions
  30 and91. Their direct sum is the121-dimensional cyclic orbit span.
  BF3 transfers the bound by homogeneity, affine conjugacy and
  positive homothety, while keeping pointwise and global field
  Casimir operations distinct.
reproducibility: >
  Run python -X utf8 -I computation/geometric-unity/BF_h6_casimir.py
  in the pinned environment. The helper reads the explicit public
  tensor certificate, imports BC's public actions without its main,
  checks every hook/invariance/closure and spectral component, and
  writes stdout only. Rational arithmetic and exact Gram elimination
  supply the spectral certificate; the121-dimensional conclusion
  also requires the separately stated representation proof.
limitations: >
  The entire curvature kernel and its nonlinear zero locus remain
  unknown. A kernel vector is not a full field solution. No global
  minimal polynomial, Casimir eigenfield reconstruction or unrestricted
  GU classification is supplied. Other lambda, curved bases and
  coincident field sectors are outside the result. External peer
  review remains outstanding; no physical or literature-priority
  claim is made.
dependencies: [AZ1, AM1, BC1, BA1, BA2]
