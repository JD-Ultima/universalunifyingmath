result: >
  At every point of the flat positive Z1 model with lambda=1/5 and
  any positive constant observer scales, the H6 coefficient-curvature
  kernel contains the121-dimensional SO5 cyclic module generated by
  BC's closed tensor. It splits into harmonic degrees3 and5 of
  dimensions30 and91. Thus the full map has kernel dimension at least121
  and rank at most36487, not a computed exact kernel dimension or rank.
