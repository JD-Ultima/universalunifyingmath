formalization_status: >-
  The positive flat observer, compact real H6Gamma branch, and exact
  triangular field space of BR/BV. The measure is fixed and finite.
proof_status: >-
  QR decomposition gives the analytic transport formula. Leading minors
  and Haar Fubini supply a common oriented diagonal limit almost
  everywhere. Dominated convergence places the limiting point value in
  a rotation of W. BV and the positive baseline contradict the full
  pointwise equations on that limit.
reproducibility: >-
  The proof is analytic, with the exact triangular and quadratic
  certificates in BR and BV. No numerical flag calculation is a premise.
limitations: >-
  The result concerns fixed finite measures on the compact rotation
  group. Arbitrary smooth closed fields, distributional sums and the
  other observer branches remain open.
