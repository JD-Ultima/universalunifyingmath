result: "M. Upsilon = 0 on a neighbourhood in Z2 for the members round 8 left open: no solution on any open set meeting s(X) for every member with (x, y) != 0 (both real forms), and on every open set for span(W_A, W'_A), for x = +-y in (7,7) (including the null members with xz - yw = 0); for (x, y) = 0 the only solution is T = 0, for every metric; open only for the twisted members x (W_A + c W'_C Ad_Gamma), c != 0, with xz +- yw = 0 (up to symmetry), away from s(X), where a solution would need special base curvature (kappa != 0, slaved T_e in V, det M != 0)"
