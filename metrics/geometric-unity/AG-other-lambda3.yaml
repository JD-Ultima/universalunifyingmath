formalization_status: >
  True dualized equation, compact real (14,0), u(128), fixed parallel real WA,
  constant kappa!=0, invariant odd field, det M!=0 and only the Lambda3 w/cGamma
  non-vector kernel, away from other singular factors. The compact phase is
  k=i[r*w_lift(omega)+s*c_lift(omega)Gamma], with real smooth chart weights
  not both zero. Both exact charts cover the conic, including zero-u endpoints.
proof_status: >
  AG1 derives full grade5 and grade9 RIGHT-Gamma quadratic identities using the
  two-pattern metric-contraction count and complete symbolic-weight calibration.
  AG2 excludes competing H5 terms by representation types and the separate
  grade4/12 derivative proof, so AA7 forces zero or simple omega. AG3 derives
  the same simple-form symmetric Gamma tensor as AF by its full SO14 orbit and
  uses the rank14/rank-at-most4 argument. The scalar candidate a=-1/208 has
  f(a)=-1/43264<0 on this conic. AG4 leaves only two constant odd endpoints.
  Independently accepted in reports/reviews/REVIEW30-GU-AG-2026-11-02.md; all 30 checks reproduced.
internal_consistency: >
  Exact compact-phase kernel charts are checked modulo w^2-f(a). Full quadratic
  formulas hold symbolically in r,s on decomposable and nondecomposable controls,
  including full fourteen-dimensional support. The hook coefficients have no
  common nonzero real weight zero. The simple converted tensor has eigenvalues
  -88rs/3 and 40rs on dimensions 3 and 11, and a non-coordinate stress control
  agrees. Nonzero Cartan derivatives remain in other grades.
reproducibility: >
  Python 3.12, SymPy 1.14.0. Run python -X utf8 -I
  computation/geometric-unity/AG_other_lambda3.py. The portable fresh default
  passes 30 exact checks in 8.6 seconds, with no randomness, numerical fitting or
  off-repository dependencies. It uses T's accepted Clifford engine, not the J/R evaluator.
novelty: >
  A bounded continuation within this investigation from AF's first Lambda3
  conic to the other real Lambda3 factor, with its different compact phase and
  nonlinear coefficients. No general singular-stratum or literature novelty claim.
empirical_testability: None new; a necessary field-equation obstruction.
