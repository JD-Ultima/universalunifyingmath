result: >
  On the single real WA Lambda3 w/cGamma kernel conic, full solutions have no
  nonzero-u point. A connected solution domain remaining in this branch has
  constant odd field at a=t/kappa=-3/272 or -1/240, w=u/kappa=0. These are
  necessary endpoints; their remaining even-field/PDE equations are unresolved.
