result: >
  Complete classification of both single WA Lambda3 kernel branches on positive
  Z1 over smooth positive four-bases, for every lambda<1/4 and cH,cV>0.
  The first branch has exactly To=-i*kappa*Phi1/400, Te=0 over a flat projected
  base, at lambda=1/5 and cV*kappa^2=150000/11. The opposite branch has no solution.
claim_id: [GU-054]
result_ids: [AK1, AK2, AK3]
gaps: [GU-G14, GU-G15]
