result: "Q. Upsilon = 0 near s(X) in the Zorro metric Z1 for the members round 10 leaves open (the cone xz +- yw = 0 other than the multiples of W_A, x = +-y in (7,7), (x,y) = 0), with kappa != 0 and the slaved T_e in V (det M != 0): for the twisted cone x(W_A + a W'_C Ad_Gamma), a != 0 (in (7,7) also the N < 0 family through the swap with g_aleph -> -g_aleph, which is Z1 with (-cH, -cV)), there is no solution on an open set meeting s(X) in (7,7), and in (14,0) a solution forces lambda = 1/5, a Ricci-flat base and no type-(ii) point, and for real-analytic t, u it is a flat-base solution with constant (t, u) and T_e = 0; the (7,7) null members and the members with x = +-y, xz - yw != 0 have no solution near s(X); for (x,y) = 0 the only solution is T = 0, for every Z1 metric, on every open set. With round 10 this settles the Z1 question near s(X) for every member of the family, up to type-(iii) points for non-analytic fields in (14,0) (where only Ric_g = 0 is shown). The flat-base constant solutions exist for every (14,0) member iff cV kappa^2 >= 9360 (x'^2 + y'^2)"
