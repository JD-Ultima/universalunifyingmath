result: >
  The entire first pure WA hook H2Gamma admits no smooth full solution over
  any smooth positive four-base with Z1 at lambda=1/5. Covariant closure,
  a flat-model curvature certificate and fibrewise metric density force
  the even field to vanish, contradicting the Euler Ricci identity.
