formalization_status: >
  True dualized equation, (14,0), compact u(128), fixed parallel real WA,
  positive constant cH,cV, constant real kappa!=0, invariant odd field
  t=3kappa/136 and u=0. The even equation leaves exactly iB*Gamma with B in
  H2; vector determinant is automatically positive and other even blocks
  invertible. AX1 holds on any positive observer metric. AX2 and AX3 use
  a flat positive four-base, Z1 and lambda=1/5, locally SL5(R)/SO5.
  AX4 and AX5 allow every smooth positive four-base, retaining Z1 and
  lambda=1/5. Actual fields are smooth on an arbitrary nonempty open
  observer domain; no field or base analyticity is imposed.
proof_status: >
  AX1: normal-frame commutator and both differentiated hook identities give
  (D_WA k)_a*Gamma=2[(d_nabla B)_a-ea wedge div_external B]; contraction
  gives -22 div_external B. The grade-eleven equation is exactly covariant
  closure. AX2: d_nabla squared acts by coefficient-covector curvature.
  The full SL5/SO5 ambient map is injective on H2. Exact rational elimination
  plus sixteen square determinant witnesses give combined rank 1274 after
  378 hook constraints, hence curvature rank 896 on H2. An independent
  nonorthogonal-basis integer construction proves maximal rank modulo the
  prime 104729, which also proves real injectivity. AX3: the even field is
  zero, contradicting V3's nonzero positive flat-model grade-one baseline.
  AX4: an exact bundle lift (z,h)->(epsilon*z,epsilon^-2*h) pulls the full
  Z1 metric back to that for the auxiliary base g_epsilon(z)=g(epsilon*z).
  The fixed-point observer metric is unchanged, and its entire two-jet
  tends to the flat model. One global maximal minor persists at a finite
  radial point. At each fixed base point the combined matrix is analytic
  on the connected positive fibre, so its injective locus is open dense.
  AX5: closure and continuity force B=0 on every actual fibre-open domain
  slice. V3 then requires positive Einstein Ricci, while AU1 gives
  Ric(E,E)=-1 for the nonzero vertical Euler vector.
internal_consistency: >
  All tensor slots are covariant. Covector curvature is -R transpose;
  contraction uses the inverse metric in each non-unit basis. Matrix-coordinate
  AM curvature is -[[X,Y],Z]/4; the certificate's fourfold scale has the same
  kernel. Metric skewness, Bianchi and Ric=-5 times the trace metric are
  checked. Constant-sectional-curvature tensors annihilate all of H2 in
  the rational control, so no general injectivity claim is inferred from
  nonzero curvature alone. Curved jets need not preserve the flat sign
  blocks; AX4 continues one full maximal minor rather than separate blocks.
  The radial witness and minor may depend on the base point. Density concerns
  metric-only analytic functions; no field is extended to the radial witness
  or outside its actual open domain. Injectivity at every curved point is
  neither required nor claimed.
reproducibility: >
  Three standalone helpers, without earlier helper imports or output writes.
  The derivative helper checks all 12,544 basis columns, a universal linear
  certificate. The curvature helpers use exact SymPy QQ and independent
  standard-library modular elimination respectively. Commands are included
  in scripts/verify.py --recent. Their original timings and review receipts
  remain in the outputs and Reviews55-56. AX4-AX5 are hand proofs reviewed
  in Reviews57-58; no new numerical sample, helper, output or local rerun
  supplies the curved-base conclusion. The selected manifest is unchanged.
novelty: >
  Extends X's declared common-axis exclusion to the entire first pure hook
  over every smooth positive four-base for Z1 at lambda=1/5. The rank input
  remains the exact flat-model calculation; the extension uses full-metric
  rescaling, analytic metric minors and continuity of actual smooth fields.
  The symmetric-space geometry and exterior covariant derivative identities
  are classical. No literature-first theorem, classification of other hooks
  or physical conclusion is asserted.
empirical_testability: None new; a conditional mathematical exclusion.
dependencies: [V3, R2, F7, AM1, AU1]
confidence: >
  Two different bases and elimination implementations agree on full rank.
  Reviews55-56 assess the original derivative and flat-model bridge.
  Reviews57-58 assess the full curved-base argument, including its domain
  and analytic-minor assumptions. External peer review remains outstanding.
pending_work: >
  Other pure hook cases, all coincident factors, first-hook values at other
  lambda, other operators and real forms remain open. No classification of
  rank-deficient curved observer points is supplied. A symbol kernel or
  algebraic compatibility alone does not establish a field solution.
