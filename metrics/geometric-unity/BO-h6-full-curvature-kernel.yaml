formalization_status: >-
  Flat positive Z1, lambda=1/5, with BG's metric and symmetric-space
  curvature. The linear rank transfers to positive constant observer
  scales. The obstruction comparison uses BN's real quadratic convention.
proof_status: >-
  Modular ranks of 185 reconstructed weight blocks bound the characteristic
  zero rank from below. Eighteen exact rational highest vectors and
  complete reducibility give the matching kernel bound. The real witness
  is checked directly in the physical frame.
reproducibility: >-
  The public verifier rebuilds the rational model, checks all extremal
  vectors, recomputes all modular ranks, and verifies the physical grade-nine
  witness from adjacent data. It writes stdout only.
limitations: >-
  This classifies a pointwise linear necessary condition. Full nonlinear
  feasibility, smooth local realization of general compatible values,
  curved observers and other branches remain outside the result.
