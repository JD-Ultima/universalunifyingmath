  A real nonzero mixed cubic/quintic H6 value satisfies the complete
  grade-one field equation after positive amplitude normalization.
  A rational contraction certificate proves existence on a specified
  slice of the complete six-amplitude coordinate-permutation family.
  Other quadratic constraints and full field solutions remain separate.
