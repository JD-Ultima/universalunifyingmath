result: >
  Exact full bosonic-system formulation on the nonzero-w opposite Lambda5
  w/cGamma conic. Within the declared ansatz, Upsilon=0 is equivalent to
  AQ1.1 with the actual form norm/Gram, the entire AH2 Gamma tensor, a
  determined full covariant five-form jet and one algebraic compatibility
  tensor. Neither existence nor a general nonzero-w exclusion is proved.
