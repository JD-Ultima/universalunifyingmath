result: >
  With the fixed U quadratic metric jet, zero cubic coefficients, arbitrary
  homogeneous symmetric quartic Q4 and arbitrary smooth remainder with zero
  derivatives through order four, the relaxed system remains obstructed for
  rho!=0, lambda=1/5 and positive cH,cV. Its coefficient rank is 42 and augmented
  rank 43 at a fibre witness. No fibre-open consistent patch exists. In S.0's
  slaved vector sector the twisted cone has no Upsilon=0 solution on an open
  set meeting that fibre. Arbitrary Weyl/quadratic and cubic jets remain open.
