result: >
  A smooth Riemannian four-metric with nonzero rank-one Ricci tensor and vanishing
  mixed Weyl components W(p,u,v,w), for u,v,w perpendicular to its Ricci eigenline p,
  has a fibre-open relaxed-system obstruction at lambda=1/5 and positive cH,cV.
  Under the S.0 slaved-vector hypotheses the twisted cone has no Upsilon=0 solution
  on an open set meeting that fibre. All cubic/quartic metric coefficients and smooth
  zero-four-jet remainders are allowed. General mixed Weyl curvature and Ricci-flat
  nonflat points are outside the theorem.
