result: >
  The remaining single opposite Lambda5 conic has no zero-u points, no open
  constant-odd patch and no open Euler-invariant scalar patch on positive Z1.
  A solution requires lambda=1/5, base Ricci rank at most one, and avoidance
  of the actual local-parallel set. A Ricci-Hessian bridge transfers the
  existing geometric relaxed-system obstructions. The odd gradient has the
  fixed negative Euler Ricci eigenvalue, and regular scalar profiles satisfy
  an implicit linear ODE. AW subsequently excludes actual full solutions in
  this single-conic setting using AR1 and AR5.
