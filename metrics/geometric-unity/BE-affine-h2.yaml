result: >
  No affine-G-invariant full bosonic field exists on the pure actual H2
  branch t=3kappa/56,u=0 over a flat positive four-base with reconstructed
  Z1, for every lambda<1/4, positive constant observer scales and real
  kappa!=0. A grade5 coefficient forces the first invariant amplitude
  to zero; the remaining grade1 possibilities have a strictly positive
  horizontal residual for all mu,rho>0.
