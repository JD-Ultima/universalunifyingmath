result: >
  At every positive Riemannian four-metric point with Ric=0 and Riemann!=0,
  reconstructed Z1 at lambda=1/5 and cH,cV>0 has no nonempty fibre-open relaxed
  consistency patch. Under S.0, the twisted-cone full equation has no Upsilon=0
  domain meeting that fibre; all other nonzero reconstructed members are excluded
  separately by S16(b), which already forces their base projection to be flat.
  Arbitrary higher metric jets are allowed. Zero-curvature points remain outside this theorem.
