  Every nonzero real value in BG's full 14-dimensional SO5 harmonic
  degree-two H6 curvature summand has nonscalar grade-one quadratic.
  At flat positive Z1 lambda=1/5 and positive scales, a smooth full
  pure H6Gamma solution cannot take a value in that summand at any point.
