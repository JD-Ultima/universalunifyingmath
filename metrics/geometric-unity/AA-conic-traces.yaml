result: >
  Exact invariant trace reduction on each of the four nonconstant real WA Lambda3/5 conics away from
  intersections and det M=0. The Gamma equation fixes the extra kernel norm, and the Phi1 trace reduces
  to a scalar second-order equation. A nonnegative Einstein-tensor trace excludes an interior local
  maximum of t/kappa on every left branch, including reaching its zero-u endpoint.
  On the two c/wGamma conics the full derivative factors through weighted exterior derivative and
  codifferential lifts; its principal symbol in the kernel form is injective for nonzero real covectors.
  On the single Lambda3 c/wGamma branch, a nonlinear H5 projection imposes an additional pointwise
  condition on the three-form and excludes explicit nondecomposable forms independently of derivatives.
