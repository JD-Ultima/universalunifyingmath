result: >
  Exact covariant first-order reduction of the two opposite Lambda5 constant
  endpoints a=-3/704,-1/160. Full derivatives retain the Cartan component and
  have only grade 5 or grade 9, respectively. Within the declared ansatz the
  full bosonic Upsilon equation is equivalent to AH6's metric/Gram equation,
  one unused-grade algebraic constraint and a determined full covariant jet.
  Exact first-jet controls permit nonzero ordinary and axial norm currents. Smooth fixed-background
  solutions, if they exist, are determined by one point value on a connected
  common domain. No observer metric or local solution is constructed. The later
  AN obstruction excludes actual positive-Z1 constant-endpoint domains.
