result: >
  No affine-G-invariant full bosonic field exists on the pure H4 branch
  t=kappa/24,u=0 over a flat positive base, Z1 lambda=1/5, for any
  positive constant observer scales. The complete invariant derivative
  kernel has dimension six; eighteen necessary grade5/9 quadratics and
  exact rank-one monomial elimination force its amplitudes to vanish.
  The remaining strictly positive grade-one baseline excludes zero.
