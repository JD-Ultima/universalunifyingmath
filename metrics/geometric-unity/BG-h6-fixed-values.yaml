result: >
  At flat positive Z1 lambda=1/5 and all positive observer scales, the
  complete SO4-fixed H6 coefficient-curvature restriction has rank 20
  on a 23-dimensional domain and kernel dimension three. Its SO5 orbit
  span has dimension 135, a contained module rather than the whole
  ambient kernel. The quadratic grade-one difference is positive
  definite on the three fixed values. A smooth full pure H6Gamma
  solution cannot take a value fixed by that SO4 or a conjugate at any point.
