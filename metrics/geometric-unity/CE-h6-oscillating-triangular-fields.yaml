result: >-
  No finite joint frequency and rotation measure of closed H6
  triangular fields with sufficiently small imaginary characters
  solves the full equation on a nonempty open set.
proof_status: >-
  Continuity of the closed stack gives uniform Hermitian positivity
  of the triangular receiver for small frequencies. The radial QR
  limit is a Fourier transform of a finite vector measure. Product
  Fubini and Cesaro averaging isolate its frequency atoms, where the
  receiver contradicts the fixed positive solution norm.
limitations: >-
  The flat positive compact-real pure H6 branch at lambda 1/5.
  Frequencies are in a neighborhood of zero and total variation is
  finite. Arbitrary closed fields remain open.
