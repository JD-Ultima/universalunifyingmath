result: >
  For the complete local metric polynomials g_(rho,p)(x)=I-rho R0(p)_iajb x^a x^b/3,
  where |p|=1 and R0(p)=((p tensor p-I/6)/2) wedge I, every rho!=0 and positive cH,cV
  at lambda=1/5 gives an inconsistent point of S's 42-unknown relaxed system in the
  fibre over 0. There is no nonempty fibre-open consistent patch. In the hypotheses
  of S.0 this excludes a twisted-cone Upsilon=0 solution on an open set meeting that
  fibre. The result does not classify arbitrary rank-one-Ricci metrics.
