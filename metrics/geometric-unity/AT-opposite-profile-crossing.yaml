result: >
  At the simple zero a*=-491/26416 of AR5b's leading coefficient, the scalar
  profile has a unique bounded analytic germ with exact forced value and slope.
  An actual AR solution cannot have a critical point at that level. Any actual
  crossing is therefore regular and requires 0<kappa^2*c0<3241880613/6380808980.
  Positive scalar germs in this interval do not establish metric/form existence.
