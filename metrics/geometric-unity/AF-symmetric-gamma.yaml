  non-vector kernel branch, away from intersections and det M=0, has w=u/kappa=0.
  On a connected domain the odd field is constant at a=t/kappa=-3/112 or -1/400.
  These are necessary endpoints within AF. AK subsequently classifies them over positive Z1.
