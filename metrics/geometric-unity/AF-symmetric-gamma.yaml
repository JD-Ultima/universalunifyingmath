formalization_status: >
  True dualized equation, real fixed parallel WA, compact u(128), kappa constant
  and nonzero, invariant odd field, Te=Sigma(dt,du)+k with one Lambda3 c/wGamma
  kernel and det M!=0. AA7 restricts the real three-form to zero or decomposable.
  No curvature-trace sign or special observer metric is assumed. Both real chart
  weights are nonzero at w!=0. Grade13 is converted by RIGHT Gamma multiplication.
proof_status: >
  AF1 derives the full symmetric converted equation from symbolic orbit
  calibrations and universal contraction counts. The scalar identity has rank 14,
  whereas the remaining tensor rank is at most four. The resulting rank one versus rank three
  equality forces the three-form and slaved gradient to vanish at w!=0.
  Its scalar part would force a=-1/208, where f(a)=-3/14872<0. AF2 excludes such
  points; AF3 uses connectedness and the exact two conic endpoints.
  Accepted in independent internal Review28.
internal_consistency: >
  Exact complete symbolic-weight Clifford output gives -88rs/3 and 40rs on the
  simple three-plane and its perpendicular. Aligned vector output gives 16bc;
  B0=208wC gives 3328w. Vector derivatives, kernel derivatives and mixed terms
  have zero symmetric converted output. The invariant baseline contributes
  -u*(kappa+208t). Ten exact controls include a non-coordinate simple plane.
reproducibility: >
  Python 3.12, SymPy 1.14.0. Run python -X utf8 -I
  computation/geometric-unity/AF_symmetric_gamma.py. Ten controls pass in 2.7 seconds.
  Uses T's accepted Clifford engine, without J/R evaluator imports or
  off-repository dependencies. The rank proof is hand reasoning.
