result: >
  For smooth Riemannian four-metrics whose curvature at a point is rho R0+omega W0,
  rho!=0, in one orthonormal frame, every real Weyl amplitude is obstructed at
  lambda=1/5 and positive cH,cV. W0 has sectional entries +1 at 01 and 23, -1 at
  02 and 13, and zero at 03 and 12. Arbitrary cubic/quartic coefficients and smooth
  zero-four-jet remainders are allowed. Some positive fibre witness has coefficient
  rank 42 and augmented rank 43. No fibre-open consistent patch exists, and in
  S.0's slaved vector sector the twisted cone has no Upsilon=0 solution on an open
  set meeting the fibre. The full Weyl tensor outside the declared orbit is not covered.
