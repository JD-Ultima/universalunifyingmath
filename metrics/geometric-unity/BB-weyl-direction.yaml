result: >
  For the complete normal quadratic metric with curvature rho R0+omega W0,
  rho!=0, where W0 has sectional entries +1 at 01 and 23, -1 at 02 and 13,
  and zero at 03 and 12, every real Weyl amplitude is obstructed at lambda=1/5
  and positive cH,cV. Some positive fibre witness has coefficient rank 42 and
  augmented rank 43. No fibre-open consistent patch exists, and in S.0's slaved
  vector sector the twisted cone has no Upsilon=0 solution on an open set
  meeting the fibre. Arbitrary higher jets and arbitrary Weyl tensors are not covered.
