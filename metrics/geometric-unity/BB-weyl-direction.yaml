novelty: >
  Extends the bounded complete-quadratic calculation to one declared nonzero
  Weyl direction at every real amplitude. Two witnesses remove the roots of
  one compatibility certificate, while coefficient-rank failures are audited
  separately. This is not a universal rank-one-Ricci classification.
reproducibility: >
  Python 3.12, sympy 1.14.0, exact Fractions and QQ[w] domain determinants.
  No randomness. Run python -X utf8 -I computation/geometric-unity/BB_weyl_direction.py
  from the repository root. The recorded full run takes 52.3 s and passes all
  exact driver assertions. Four signed witness analyses and twelve finite
  exception ranks are printed, with complete row polynomials and determinant
  factorizations. The entire coefficient matrix is checked at a fourth node.
empirical_testability: None new; a mathematical obstruction in the declared reconstructed sector.
dependencies: [U1, U2, U5, S4, S5, Q5, xcheck_round10]
confidence: >
  High for the exact calculations and degree-bound argument, independently checked
  in internal Review21. The all-amplitude conclusion follows from polynomial identities and
  finite exact rank resolution, not sampled amplitudes. The complete quadratic
  metric assumption fixes the higher jets; arbitrary cubic/quartic coefficients
  and nonzero Weyl tensors outside the declared direction remain open.
pending_work: >
  A next bounded problem is to test Z's cubic-invariant subsystem and kernel completion uniformly
  over this Weyl pencil, including finite coefficient-minor exceptions, before
  allowing arbitrary higher metric jets. The rho=0 frontier is not addressed.
