formalization_status: >
  The complete metric is I-(rho R0+omega W0)_iajb x^a x^b/3, with cubic and
  quartic metric coefficients fixed to zero. It is positive definite near 0;
  its Ricci tensor there is rho e0 tensor e0 and Weyl tensor is omega W0.
  Naturality normalizes rho to sigma=+/-1 and the dimensionless Weyl amplitude
  to w=omega/abs(rho). The observer metric inverse at the origin is w-independent.
  Hand jet bounds give degree A<=2 and degree RHS<=3 before exact interpolation.
internal_consistency: >
  W0 satisfies Bianchi and has zero Ricci tensor. At the two fibres diag(2,3,4,5)
  and diag(2,3,5,7), the selected three rows have only xi_13 and one common n
  combination. Their row polynomials and four compatibility quartics are recorded
  exactly. The two compatibility quartics are coprime for each sign. Four
  coefficient determinants per sign are computed over QQ[w] from degree-bounded
  entries. The square-free gcd of their products with compatibility determinants
  leaves six rational exceptions per sign; exact full coefficient ranks resolve
  all twelve at the first witness, with nonzero compatibility determinant.
proof_status: >
  BB1 is a hand jet-degree bound. The sparse row identities, interpolation,
  coefficient determinants, gcds and exceptional ranks are exact computer-assisted
  certificates. BB2 uses those ranks, S4's rational fibre-minor argument and the
  local U5 field-equation reduction. Independent internal Review21 accepts BB1-BB2
  and reproduces the exact calculations. No arbitrary higher-jet or general-Weyl
  extension is claimed.
