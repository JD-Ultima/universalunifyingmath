formalization_status: >
  True dualized bosonic equation, fixed parallel real WA, observer
  signature (14,0), compact u(128), real smooth fields and constant
  kappa!=0. Flat positive four-base, Z1 lambda1/5 and cH,cV>0.
  The even hook tensor is the restriction of a tensor invariant under
  GL+(4) semidirect R4 acting on G/SO4. BA/R/V make the indicated hook the
  entire even kernel, with a regular vector block and zero source.
  Affine invariance is an essential extra assumption; it is not
  inferred from smoothness, closure, parallelism or constant odd fields.
proof_status: >
  BC1 keeps both even-sign characters0 and15, then averages complete
  coordinate orbits over24 orientation-preserving signed permutation
  representatives. Exact six-generator invariance and inverse-Gram
  hook equations construct the full13/23 invariant hook spaces.
  All-slot Nomizu derivatives and exact nullspaces, with nonzero
  square minors, give ranks7/22 and kernels6/1. Actual H4 uses H10
  dual closure, equivalently form-slot co-closure. BC2 independently
  reconstructs the1358-entry H6 generator before comparing its JSON
  certificate. Two Clifford implementations agree on norm-normalized
  grade-one diagonal moments -13589/13023,-162854/117207,-8522/13023.
  Horizontal minus trace-free-vertical is positive40553/117207 times
  the squared norm. An isotropic positive baseline therefore forces
  zero hook, then contradicts its own positivity. BC3 proves that
  affine conjugacy and positive homothety preserve the obstruction
  for every positive observer scale at the same lambda.
reproducibility: >
  Run python -X utf8 -I computation/geometric-unity/BC_affine_hooks.py
  and BC_quadratic_xcheck.py with the pinned environment. The first
  uses standard-library rational tensor/Clifford arithmetic and exact
  SymPy QQ elimination; the second uses a separate sorted-generator
  Clifford product and nested cubic-gradient lookup with no earlier
  engine import. The main construction also compares42 selected
  coefficients with a complete cubic-gradient evaluator. Both write
  stdout only. The explicit JSON generator is fully reconstructed
  by the main helper rather than trusted as a selected input.
limitations: >
  This excludes the affine-invariant H6Gamma ansatz only. General
  smooth H6Gamma fields, curved bases, other lambda values, the six
  actual H4 derivative candidates and all coincident kernels remain
  open. Higher quadratic grades are not assumed solved; failure of
  the necessary grade-one equation suffices for the stated exclusion.
  No full ambient H6 curvature rank, physical conclusion or
  literature-priority claim is made. Internal AI-assisted reviews
  are distinct from external peer review.
dependencies: [AZ1, BA1, BA2, R2, V1, T2, F7]
