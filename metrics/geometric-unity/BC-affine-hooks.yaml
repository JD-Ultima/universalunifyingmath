result: >
  No affine-G-invariant full field exists on the pure H6Gamma branch
  t=3kappa/104,u=0 over a flat positive base at Z1 lambda=1/5,
  for any positive constant observer scales. The necessary invariant
  closure map has rank22 on23 dimensions; its sole real line has
  anisotropic nonlinear grade-one moments. The analogous actual H4
  derivative map has rank7 on13 dimensions and leaves six candidates.
