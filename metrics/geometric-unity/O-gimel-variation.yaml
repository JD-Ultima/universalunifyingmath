result: "O. The gimel-variation of (9.4): it needs a fibre weight; in every (7,7) case (base (1,3), (3,1), (2,2)) no natural weight function converges and the natural convergent weights are measures on the scaling ray through s(X); the gimel-equation is empty at T = 0, is the weighted Einstein-Hilbert equation of g_aleph at first order in T, and on the invariant sector T = t Phi^1 + u Phi^1 Gamma (constant t, u) is exactly 4D vacuum GR with Lambda = Lambda_A - (7 c_H/6) P~/a (Z2, weight-independent; Z1 times a moment ratio r_mu), i.e. reading (A) of F at leading order, if Upsilon = 0 is kept unweighted (off-shell: in this sector Upsilon = 0 itself holds near s(X) only on the round-10 flat-base solutions); if the weight is also used for varpi it forces a = 0 and the Einstein term disappears; on-shell, the round-10 flat-base solutions (Z1, (14,0), lambda = 1/5) solve the joint system iff c_V kappa^2 = 12480 x'^2"
