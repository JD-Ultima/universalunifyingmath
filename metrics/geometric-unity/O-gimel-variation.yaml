confidence: >
  High for O1-O13 as stated: the no-go is a short measure-theoretic argument whose algebraic input is exact; the
  reduced 4D functionals are exact consequences of closed forms that are themselves re-checked by brute force on and off
  the section. The explicit gimel-equation covers only the invariant sector with constant t, u and T_e = 0; the slaved
  sector, nonconstant t, u and the symmetric sector are not treated; q_y (Z1 off the ray) is not computed; the draft
  specifies neither the weight, nor the system (S1)/(S2), nor the identification of configuration spaces, and off-shell
  the Z2 result beyond leading order depends on the last.
